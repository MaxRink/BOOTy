# full.yaml — complete BOOTy configuration reference.
#
# This file documents every supported field with its type, valid values, and
# default. It is loaded by TestLoadFullYAMLReference in loader_test.go to
# verify that all fields round-trip correctly.
#
# A production config only needs the fields relevant to the active mode — all
# other sections are optional and default to zero values.

hostname: node-01          # Machine hostname — used for logging and JWT acquisition
mode: provision            # Operating mode: provision | deprovision | soft-deprovision |
                           #   decommission | standby | dry-run | check (default: provision)
dryRun: false              # Override mode to dry-run when true (default: false)
osFamily: ubuntu           # Target OS family for target-root writers

# CAPRF legacy parity. legacyCompat is a preset: it fills the options below
# that are not set (docs/configuration.md#caprf-legacy-compatibility). Every
# option also works without it; an explicit value always wins.
legacyCompat: false        # CAPRF_LEGACY_COMPAT (default: false)
successAction: poweroff    # SUCCESS_ACTION: reboot (default) | poweroff
failureAction: wait        # FAILURE_ACTION: reboot (default) | wait
provisionerFilesTarget: ramdisk # PROVISIONER_FILES_TARGET: target (default) | ramdisk
ramdiskHostname: true      # RAMDISK_HOSTNAME: name the ramdisk after hostname (default: false)

# ---------------------------------------------------------------------------
# Network — configures the in-ramdisk network stack.
# All modes share this section since connectivity must be established first.
# ---------------------------------------------------------------------------
network:
  # mode selects the network stack implementation.
  # Valid values: gobgp | frr | static | dhcp | "" (auto-detect from fields)
  mode: gobgp

  # dnsResolvers is a comma-separated list of DNS server IPs.
  dnsResolvers: "8.8.8.8,1.1.1.1"

  # waitMode (NETWORK_WAIT_MODE): default (up to 3 setups, 5 minutes each) |
  # rounds (one setup, waitMaxAttempts rounds of 20 s, like wait_for_network)
  waitMode: rounds
  # waitMaxAttempts (NETWORK_WAIT_MAX_ATTEMPTS): rounds with waitMode rounds
  # (unset: 15; 0 fails at once)
  waitMaxAttempts: 15

  # predictableNames (PREDICTABLE_NIC_NAMES): rename NICs to the predictable
  # names that the config uses (default: true)
  predictableNames: false

  # loopbackAddresses: comma-separated CIDRs that GoBGP adds to lo, like
  # netplan "lo: addresses".
  # mtu: fabric NIC and underlay dummy MTU (GoBGP, default 9000)
  mtu: 9100

  loopbackAddresses: "2001:db8:40a:5481::17/128"

  # blackholeRoutes: comma-separated prefixes installed as blackhole routes
  # in the main table, like FRR "ipv6 route P blackhole".
  blackholeRoutes: "2001:db8:40a:5481::/64"

  bgp:
    # asn is the local BGP Autonomous System Number. ASN > 0 activates BGP networking.
    asn: 65001

    # peerMode: unnumbered (default) | dual | numbered
    #   unnumbered: link-local interface peers
    #   dual:       unnumbered for IPv4 + numbered for L2VPN-EVPN
    #   numbered:   explicit neighbor IPs (requires bgp.neighbors)
    peerMode: unnumbered

    # neighbors: comma-separated peer IPs (required for dual/numbered peerMode)
    neighbors: ""

    # remoteASN: 0 = iBGP (same AS), >0 = eBGP remote AS
    remoteASN: 0

    # underlayAF: ipv4 (default; non-ipv4 values are rejected)
    underlayAF: ipv4

    # overlayType: evpn-vxlan (default) | l3vpn | none
    overlayType: evpn-vxlan

    # authPassword: TCP-MD5 password for all BGP peers (default: "" = no auth)
    authPassword: ""

    # minPeers: minimum established peers before underlay is ready (default: 1)
    minPeers: 2

    # keepalive/hold: BGP timer overrides in seconds (0 = FRR/GoBGP defaults)
    keepalive: 0
    hold: 0

    # sessions/peerGroups: GoBGP sessions in the native form of the frr.conf
    # neighbors. A session inherits unset fields from its peer-group. A
    # non-empty sessions list replaces the frr.conf sessions; with sessions,
    # peerMode, interfaces, neighbors, remoteASN, keepalive and hold do not apply.
    # defaults: timer profile, traditional (60/180/30) | datacenter (3/9/10, default)
    defaults: traditional
    peerGroups:
      - name: leaf
        vrf: Vrf_underlay
        remoteAS: "65500"     # number | internal | external
        localAS: 65501        # local-as N no-prepend replace-as
        localASMode: no-prepend-replace-as
        keepalive: 30
        hold: 90
        families: [ipv4-unicast]   # ipv4-unicast | ipv6-unicast | l2vpn-evpn
        allowASIn: 3          # allowas-in N in each family (1-10)
    sessions:
      - name: ens1f0np0
        interface: true
        vrf: Vrf_underlay
        peerGroup: leaf
      - name: 198.51.100.1
        vrf: Vrf_underlay
        remoteAS: internal
        connectRetry: 5
        bfd: true
        bfdProfile: fabric
        families: [l2vpn-evpn]

    # bfdProfiles (BFD_PROFILES): BFD profiles of bfdProfile, like frr.conf
    # "bfd / profile NAME"; unset values use 300 ms, 300 ms, 3. A non-empty
    # list replaces the frr.conf profiles.
    bfdProfiles:
      - name: fabric
        transmitInterval: 150   # ms, 10-60000
        receiveInterval: 150    # ms, 10-60000
        detectMultiplier: 3     # 2-255

    # bfdTransmitMS/bfdReceiveMS: BFD intervals in milliseconds (0 = disabled),
    # set together; GoBGP runs BFD on the native peers with them.
    # bfdDetectMultiplier: 2-255 (0 = 3)
    bfdTransmitMS: 0
    bfdReceiveMS: 0
    bfdDetectMultiplier: 0

    # connectRetry/localAS/neighborVRF: native peer options (GoBGP), like
    # FRR "timers connect", "local-as N no-prepend replace-as" and
    # "router bgp N vrf NAME". Explicit values also replace frr.conf values.
    connectRetry: 5
    localAS: 65501
    neighborVRF: "Vrf_underlay"
    # allowASIn/multipathRelax/installRoutes/fastExternalFailover: unset keeps
    # the frr.conf behaviour (FRR defaults) or off without frr.conf.
    allowASIn: 3
    multipathRelax: true
    installRoutes: true
    fastExternalFailover: true

  evpn:
    # underlaySubnet: IPv4 subnet for loopback IP derivation (e.g. "192.168.4.0/24")
    underlaySubnet: "192.168.4.0/24"

    # underlayIP: direct loopback IP override; takes precedence over underlaySubnet
    underlayIP: ""

    # overlaySubnet: IPv6 subnet for overlay address assignment
    overlaySubnet: "2a01:598:40a:5481::/64"

    # provisionVNI: VXLAN Network Identifier for the provisioning overlay (0 = disabled)
    provisionVNI: 100

    # provisionIP: IP/CIDR to assign to the provisioning bridge
    provisionIP: "10.100.0.20/24"

    # provisionGateway: VTEP gateway IP for BUM traffic flooding
    provisionGateway: "10.100.0.1"

    # l2Enabled: enable Type-2/Type-3 EVPN route processing (default: false)
    l2Enabled: false

    # type5Only: Type-5 routing without an L2 gateway. Unset: true when the
    # provisioner frr.conf maps provisionVNI to a VRF (L3VNI).
    type5Only: false

    # type5Networks: comma-separated prefixes originated as EVPN Type-5
    # routes (FRR "network" with "advertise ipv4|ipv6 unicast").
    type5Networks: "2001:db8:40a:5481::17/128,2001:db8:40a:5481::/64"

    # bridgeName/vxlanName: provision bridge and VXLAN device names
    # (default: "br.provision" and "vx<VNI>").
    bridgeName: "br.provision"
    vxlanName: "vx.100"

    # bridgeMAC/vxlanLink/underlayDummyName: provision devices (GoBGP)
    bridgeMAC: "02:54:c0:00:02:11"
    vxlanLink: "dum.underlay"
    underlayDummyName: "dum.underlay"

    # dcgwIPs: comma-separated Data Center Gateway IPs (OneFabric topologies)
    dcgwIPs: ""

    leafASN: 0
    localASN: 0
    overlayAggregate: ""
    vpnRT: ""

  static:
    # ip: IP/CIDR to assign (activates static mode when BGP is not configured)
    ip: ""
    gateway: ""
    iface: ""  # "" = auto-detect first physical NIC

  bond:
    # interfaces: comma-separated NICs to bond (activates LACP bonding when set)
    interfaces: ""
    # mode: Linux bonding mode (default: 802.3ad)
    mode: "802.3ad"

  vlan:
    # config: multi-VLAN spec "ID:parent[:address[:gateway]],..."
    # Example: "200:eno1:10.200.0.42/24,300:eno2"
    config: ""

  vrf:
    # name: VRF interface name (default: "" = no VRF)
    name: ""
    # tableID: routing table ID for the VRF (default: 1000)
    tableID: 1000
    # overlayName: VRF of the provision bridge; "default" = default VRF
    overlayName: "default"
    overlayTableID: 0

  ipmi:
    # subnet: IPMI/BMC management network subnet for underlay IP derivation
    subnet: "172.30.0.0/24"

# ---------------------------------------------------------------------------
# Transport — CAPRF server communication settings.
# ---------------------------------------------------------------------------
transport:
  # token: bearer token for CAPRF authentication (bootstrap token or direct JWT)
  token: "bootstrap-token-xyz"

  # tokenURL: JWT exchange endpoint; when set, token is exchanged for a JWT
  tokenURL: ""

  # tokenAlgorithm: RS256 | ES256 (default: server default)
  tokenAlgorithm: RS256

  # Token expiry without tokenURL (RFC 3339) and the renewal policy.
  tokenExpiresAt: "2026-10-14T12:00:00Z"
  tokenExpiresInSeconds: 1800
  tokenRenewMarginSeconds: 120
  tokenRenewRetries: 7
  tokenRenewBackoffSeconds: 2

  initURL:    "https://caprf.example.com/status/init"
  successURL: "https://caprf.example.com/status/success"
  errorURL:   "https://caprf.example.com/status/error"
  logURL:     "https://caprf.example.com/logs"
  debugURL:   ""

  # insecure: allow bearer token over plain HTTP — TESTING ONLY, never in production
  insecure: false

  # skipTLSVerify (SKIP_TLS_VERIFY): no TLS certificate check, like curl --insecure (default: false)
  skipTLSVerify: false

  # exportVars (EXPORT_VARS): export every vars entry to the environment, like `source vars` (default: false)
  exportVars: false

# ---------------------------------------------------------------------------
# Health — pre-provisioning hardware health checks.
# ---------------------------------------------------------------------------
health:
  # enabled: run the health check suite before provisioning (default: false)
  enabled: true

  # minMemoryGB: minimum RAM in GiB (0 = no minimum)
  minMemoryGB: 16

  # minCPUs: minimum CPU core count (0 = no minimum)
  minCPUs: 4

  # skipChecks: comma-separated check names to skip (e.g. "thermal,disk")
  skipChecks: "thermal"

  # reportURL: POST endpoint for health check results JSON
  reportURL: "https://caprf.example.com/health"

# ---------------------------------------------------------------------------
# Telemetry — provisioning metrics and event reporting.
# ---------------------------------------------------------------------------
telemetry:
  enabled: true
  url: "https://caprf.example.com/telemetry"
  metricsURL: "https://caprf.example.com/metrics"
  eventURL: "https://caprf.example.com/events"

# ---------------------------------------------------------------------------
# Rescue — behavior when provisioning fails.
# ---------------------------------------------------------------------------
rescue:
  # mode: reboot (default) | retry | shell | wait
  mode: retry

  # sshPubKey: authorized SSH public key for rescue shell access
  sshPubKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG... admin@ops"

  # passwordHash: crypt(3) hash for rescue shell login
  passwordHash: ""

  # timeout: seconds before the rescue auto-action fires (0 = wait indefinitely)
  timeout: 300

  # autoMountDisks: automatically mount discovered disks in rescue mode
  autoMountDisks: false

# ---------------------------------------------------------------------------
# Provision — settings for the provisioning pipeline.
# Only read when mode is "provision" or "dry-run".
# ---------------------------------------------------------------------------
provision:
  # targetOS: required before destructive provisioning writes. Only linux is
  # currently accepted; non-Linux and unknown values fail preflight.
  targetOS: linux

  # extraKernelParams: additional kernel command-line parameters for the installed OS
  extraKernelParams: "console=ttyS0,115200"

  # failureDomain maps to topology.kubernetes.io/zone on the provisioned node
  failureDomain: zone-a

  # region: geographic region identifier for the node
  region: eu-west-1

  # providerID: kubelet --provider-id value (e.g. "redfish://bmc/Systems/1")
  providerID: "metal://node-01"

  # disableKexec: skip kexec and force hard reboot after provisioning (default: false)
  disableKexec: false

  # writeResolvConf (WRITE_RESOLV_CONF): write the installed OS resolv.conf (default: true)
  writeResolvConf: false

  # grubCmdlineMode (GRUB_CMDLINE_MODE): resolved (default) | append (like provision.sh)
  grubCmdlineMode: append

  # machineCommandsMode (MACHINE_COMMANDS_MODE): command (default) | script
  # (each /deploy/machine-commands file runs as a script, like run_script_in_chroot)
  machineCommandsMode: script

  # diskLinks (DISK_LINKS): create /dev/disk/by-* links before the target chroot (default: true)
  diskLinks: false

  # kexecUnmountTarget (KEXEC_UNMOUNT_TARGET): unmount the target filesystems before kexec (default: true)
  kexecUnmountTarget: false

  # postProvisionCmds: commands run in chroot after provisioning completes
  postProvisionCmds:
    - "systemctl enable kubelet"

  image:
    # urls: ordered list of image source URLs; multiple URLs enable fallback.
    # Supports HTTPS URLs and OCI registry references (oci://host/repo:tag).
    urls:
      - "https://registry.example.com/os-image:v1.2.3"

    # checksum: expected hex digest of the image; checksumScope selects the bytes
    checksum: "abc123def456abc123def456abc123def456abc123def456abc123def456ab12"

    # checksumType: sha256 | sha512 (default: inferred from checksum length)
    checksumType: sha256
    # checksumScope: download (file as downloaded, default) | decompressed
    checksumScope: download

    # mode: whole-disk (default) | partition | ab
    mode: whole-disk

    # sourceRootLabel/sourceRootPartition select the source-image root partition
    # for declarative partition layout streaming. A/B mode uses provision.ab.
    sourceRootLabel: ""
    sourceRootPartition: 0

    signatureURL: ""
    gpgPubKey: ""

    # allowInsecureHTTP (IMAGE_ALLOW_INSECURE_HTTP): accept http:// image URLs (default: false)
    allowInsecureHTTP: false

  ab:
    # scheme: dual-root (default). Used only when provision.image.mode=ab.
    scheme: dual-root
    # activeSlot: currently booted slot, a | b. Empty means initial provision.
    activeSlot: a
    # targetSlot: inactive (default) | a | b.
    targetSlot: inactive
    # preserveExisting: true for OS upgrades; skips disk-wide wipe and layout creation.
    # Requires activeSlot and kexec so BOOTy can switch into the target slot
    # without relying on firmware boot order that still points at the active slot.
    preserveExisting: false
    # sourceRootLabel/sourceRootPartition select the source-image root partition.
    # Prefer a stable GPT label and use the 1-based partition number only when
    # the source image has no root label.
    sourceRootLabel: rootfs
    sourceRootPartition: 0
    # bootSizeMB: shared EFI system partition size (default: 512).
    bootSizeMB: 512
    # rootSizeMB: size of each root slot (default: 32768).
    rootSizeMB: 32768
    # stateSizeMB: persistent state partition size; 0 fills remaining space.
    stateSizeMB: 0

  disk:
    # device: explicit block device path (default: auto-detect largest non-removable disk)
    device: ""

    # minSizeGB: minimum disk size in GiB for auto-detection (0 = no minimum)
    minSizeGB: 100

    # selection (DISK_SELECTION): prefer-nvme (default) | lsblk (legacy lsblk order)
    selection: lsblk

    # wipeAllDisks (WIPE_ALL_DISKS): wipe every disk, not only the target (default: false)
    wipeAllDisks: true

    # discardNVMe (DISCARD_NVME): blkdiscard NVMe disks before wiping all disks (default: false)
    discardNVMe: true

    # wipeDepth (WIPE_DEPTH): thorough (default: partitions, LVM, MD, LUKS members
    # and the table) | quick (signature wipes on the disks only, like wipe_all_disks)
    wipeDepth: quick

    # raidSuperblockClear (RAID_SUPERBLOCK_CLEAR): wiped (default: zero the RAID
    # superblocks on the disks that wipe-disks wipes) | all (every disk, like
    # clear_mdadm_superblocks)
    raidSuperblockClear: all

    # growPartition (GROW_PARTITION): root (default) | last-linux (last GPT Linux partition)
    growPartition: last-linux

    # secureErase: use ATA Secure Erase / NVMe Format instead of wipefs (default: false)
    secureErase: false

    # numVFs: SR-IOV Virtual Functions to create on Mellanox NICs (0 = skip)
    numVFs: 32

    # nvmeNamespaces: JSON configuration for NVMe namespace creation (default: "")
    nvmeNamespaces: ""

    # raid: software RAID arrays to create (default: none).
    # Arrays are stopped first, then re-created in order.
    # RAIDConfig.name must NOT include /dev/ prefix (e.g. "md0", not "/dev/md0").
    raid:
      - name: md0       # mdadm device name without /dev/ prefix
        level: 1        # RAID level: 0, 1, 5, 6, 10
        devices:
          - /dev/sda
          - /dev/sdb

    # partitionLayout: declarative GPT partitioning.
    # With provision.image.mode=whole-disk, BOOTy creates this layout and streams
    # the selected source root filesystem into the declared root mountpoint.
    # partitionLayout: null

  firmware:
    enabled: true
    url: "https://caprf.example.com/firmware"
    # logNICs (NIC_FIRMWARE_LOG): log a nic_firmware line per NIC on each provision (default: false)
    logNICs: true
    # numVFsMode (NUM_VFS_MODE): set (default) | raise (raise NUM_OF_VFS on every ConnectX NIC)
    numVFsMode: raise
    # minBIOS/minBMC: minimum acceptable firmware versions (default: "" = no minimum)
    minBIOS: "2.10"
    minBMC: "4.50"

  secureBoot:
    # reEnable: signal CAPRF to re-enable Secure Boot after provisioning
    reEnable: false
    # pinnedDigests: optional SHA256 pins for boot artifacts checked after
    # the target root and ESP are mounted.
    pinnedDigests:
      shim: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      grub: "sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb"
      kernel: "cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc"
    mokCertPath: ""
    mokPassword: ""

  cloudInit:
    enabled: false
    # datasource: nocloud (default) or configdrive
    datasource: nocloud

  overlayFS:
    # enabled: write Ubuntu overlayroot config into the provisioned root.
    # Default false; requires osFamily: ubuntu.
    enabled: true
    # mode: tmpfs (default, volatile writes) | device (persistent backing fs)
    mode: device
    # device: backing filesystem for mode=device. LABEL= and /dev/disk/by-* are supported.
    device: LABEL=BOOTY-OVERLAY
    # directory: overlayroot dir= value under the backing filesystem.
    directory: booty
    # upperDir/workDir: optional target-root paths BOOTy pre-creates for custom
    # overlayFS initramfs hooks. They must be backed by persistent storage to be useful.
    upperDir: /var/lib/booty/overlayfs/upper
    workDir: /var/lib/booty/overlayfs/work
    # recurse: false renders recurse=0 so separate data mounts stay writable.
    recurse: false
    swap: false
    debug: false
    timeoutSec: 30

  sysext:
    # enabled: copy selected systemd-sysext images into the provisioned root
    # while BOOTy still has it mounted. Default false.
    enabled: false
    # defaultMode: preload (inactive catalog) | active (/var/lib/extensions)
    defaultMode: preload
    catalogDir: /usr/lib/tcaas-sysext/preloaded
    activeDir: /var/lib/extensions
    layers:
      - name: node-tuning
        version: v1
        source: oci://registry.example.com/tcaas/sysext-node-tuning:v1
        fileName: node-tuning.raw
        sha256: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
        mode: preload

  crashArtifacts:
    enabled: false
    prepareURL: ""
    uploadURL: ""
    # maxMB: maximum archive size in MiB (default: 256)
    maxMB: 256
    # uploadTimeoutSec: upload timeout in seconds (default: 120)
    uploadTimeoutSec: 120
    # includeMemoryDumps: include raw vmcore and systemd coredump files (default: false)
    includeMemoryDumps: true

  inventory:
    enabled: false
    url: ""

# ---------------------------------------------------------------------------
# Deprovision — settings for the deprovisioning pipeline.
# Only read when mode is "deprovision" or "soft-deprovision".
# ---------------------------------------------------------------------------
deprovision:
  # secureErase: use ATA Secure Erase/NVMe Format instead of wipefs (default: false)
  secureErase: false

  # device: explicit block device to deprovision (default: "" = auto-detect)
  device: ""

# ---------------------------------------------------------------------------
# Agent — standby/hot-standby mode settings.
# Only read when mode is "standby".
# ---------------------------------------------------------------------------
agent:
  # heartbeatURL: POST endpoint for periodic keepalive signals
  heartbeatURL: "https://caprf.example.com/agent/heartbeat"

  # commandsURL: GET endpoint for polling pending commands
  commandsURL: "https://caprf.example.com/agent/commands"

  # deprovisionSuccessAction: "standby" returns to standby after a
  # successful deprovision command. Empty ends the run like successAction.
  deprovisionSuccessAction: "standby"
