frr version 9.1
frr defaults datacenter
!
vni 1000
!
router bgp 65101 vrf Vrf_underlay
 bgp router-id 192.168.4.11
 no bgp ebgp-requires-policy
 neighbor 10.254.0.3 remote-as external
 !
 address-family ipv4 unicast
  network 192.168.4.11/32
  neighbor 10.254.0.3 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.254.0.3 activate
  advertise-all-vni
 exit-address-family
!
router bgp 65101
 bgp router-id 192.168.4.11
 !
 address-family ipv4 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv4 unicast
  route-target import 65000:1000
  route-target export 65000:1000
 exit-address-family
!
line vty
!
