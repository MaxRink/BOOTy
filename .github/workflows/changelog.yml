name: Changelog

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: changelog-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Keep in sync with release-v2.yml.
  GIT_CLIFF_VERSION: "2.14.2"

jobs:
  preview:
    name: Changelog Preview
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install git-cliff
        run: pipx install "git-cliff==${GIT_CLIFF_VERSION}"

      - name: Test the changelog generator
        run: python3 -B hack/changelog_test.py

      # Fails on a changes/*.md fragment without front matter.
      - name: Generate the next release section
        shell: bash
        run: make changelog | tee -a "$GITHUB_STEP_SUMMARY"
