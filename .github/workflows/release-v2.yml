name: Release v2

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      prerelease: ${{ steps.meta.outputs.prerelease }}
      make_latest: ${{ steps.meta.outputs.make_latest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: meta
        name: Validate tag and release state
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          if [ "${VERSION}" = "${TAG}" ]; then
            echo "::error::release tag ${TAG} is not valid semver"
            exit 1
          fi

          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9A-Za-z-]*[A-Za-z-][0-9A-Za-z-]*))*))?(\+([0-9A-Za-z-]+)(\.[0-9A-Za-z-]+)*)?$'
          if ! printf '%s\n' "${VERSION}" | grep -Eq "${SEMVER_RE}"; then
            echo "::error::release tag ${TAG} is not valid semver"
            exit 1
          fi
          case "${VERSION}" in
            *+*)
              echo "::error::release tag ${TAG} contains SemVer build metadata, which cannot be used in Docker/OCI tags"
              exit 1
              ;;
          esac

          ref_json=$(curl -fsS \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}") || {
              echo "::error::could not inspect release tag ${TAG}"
              exit 1
            }
          ref_type=$(python3 -c 'import json,sys; print(json.load(sys.stdin)["object"]["type"])' <<<"${ref_json}")
          if [ "${ref_type}" != "tag" ]; then
            echo "::error::release tag ${TAG} must be an annotated tag, got Git object type ${ref_type}"
            exit 1
          fi

          if ! git fetch --no-tags --prune origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "::error::could not fetch default branch ${DEFAULT_BRANCH}"
            exit 1
          fi
          if ! TAG_COMMIT=$(git rev-list -n 1 "refs/tags/${TAG}" 2>/dev/null); then
            echo "::error::release tag ${TAG} does not resolve to a commit"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${TAG_COMMIT}" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::release tag ${TAG} points to ${TAG_COMMIT}, which is not reachable from origin/${DEFAULT_BRANCH}"
            exit 1
          fi

          status=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" || true)
          case "${status}" in
            200)
              echo "::error::release ${TAG} already exists; refusing to overwrite published assets"
              exit 1
              ;;
            404)
              ;;
            *)
              echo "::error::could not verify release ${TAG} existence, GitHub API status ${status}"
              exit 1
              ;;
          esac

          BASE_VERSION="${VERSION%%+*}"
          if printf '%s\n' "${BASE_VERSION}" | grep -q -- '-'; then
            printf 'prerelease=true\n' >> "${GITHUB_OUTPUT}"
            printf 'make_latest=false\n' >> "${GITHUB_OUTPUT}"
          else
            printf 'prerelease=false\n' >> "${GITHUB_OUTPUT}"
            printf 'make_latest=true\n' >> "${GITHUB_OUTPUT}"
          fi

  build:
    name: Build (${{ matrix.arch }}/${{ matrix.flavor }})
    needs: validate-tag
    strategy:
      matrix:
        include:
          - arch: amd64
            flavor: default
            runner: ubuntu-latest
          - arch: amd64
            flavor: gobgp
            runner: ubuntu-latest
          - arch: amd64
            flavor: slim
            runner: ubuntu-latest
          - arch: amd64
            flavor: micro
            runner: ubuntu-latest
          - arch: arm64
            flavor: default
            runner: ubuntu-24.04-arm
          - arch: arm64
            flavor: gobgp
            runner: ubuntu-24.04-arm
          - arch: arm64
            flavor: slim
            runner: ubuntu-24.04-arm
          - arch: arm64
            flavor: micro
            runner: ubuntu-24.04-arm
      fail-fast: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Assert runner architecture
        run: |
          RUNNER_ARCH="$(uname -m)"
          case "${RUNNER_ARCH}" in
            x86_64)  EXPECTED="amd64" ;;
            aarch64) EXPECTED="arm64" ;;
            *)
              echo "::error::unsupported runner architecture: ${RUNNER_ARCH}"
              exit 1
              ;;
          esac
          if [ "${EXPECTED}" != "${{ matrix.arch }}" ]; then
            echo "::error::runner architecture ${EXPECTED} does not match matrix.arch ${{ matrix.arch }}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.26.6"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003

      - name: Build binary
        if: matrix.flavor == 'default'
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.arch }} CC=gcc \
            go build -trimpath -ldflags "-s -w \
              -X main.Version=${VERSION} \
              -X main.Build=${{ github.sha }} \
              -linkmode external -extldflags '-static'" \
            -o booty-${{ matrix.arch }}

      - name: Build initramfs (${{ matrix.flavor }})
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_FLAVOR="${{ matrix.flavor }}"
          if [ "${BUILD_FLAVOR}" = "default" ]; then
            BUILD_FLAVOR="full"
          fi
          TARGET_ARG=""
          if [ "${{ matrix.flavor }}" != "default" ]; then
            TARGET_ARG="--target=${{ matrix.flavor }}"
          fi
          docker buildx build \
            ${TARGET_ARG} \
            --platform linux/${{ matrix.arch }} \
            --build-arg "BOOTY_VERSION=${VERSION}" \
            --build-arg "BOOTY_BUILD=${{ github.sha }}" \
            --build-arg "BOOTY_FLAVOR=${BUILD_FLAVOR}" \
            --output type=local,dest=out-${{ matrix.flavor }} \
            -f initrd.Dockerfile .

      - name: Generate checksums
        run: |
          if [ -f booty-${{ matrix.arch }} ]; then
            sha256sum booty-${{ matrix.arch }} > booty-${{ matrix.arch }}.sha256
          fi
          if [ -f out-${{ matrix.flavor }}/initramfs.cpio.zst ]; then
            cp out-${{ matrix.flavor }}/initramfs.cpio.zst ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst
            sha256sum ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst > ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst.sha256
          elif [ -f out-${{ matrix.flavor }}/initramfs.cpio.gz ]; then
            cp out-${{ matrix.flavor }}/initramfs.cpio.gz ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz
            sha256sum ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz > ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz.sha256
          else
            echo "::error::missing initramfs output for ${{ matrix.flavor }}/${{ matrix.arch }}"
            find out-${{ matrix.flavor }} -maxdepth 2 -type f -print || true
            exit 1
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-${{ matrix.flavor }}-${{ matrix.arch }}
          path: |
            booty-${{ matrix.arch }}
            booty-${{ matrix.arch }}.sha256
            ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz
            ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.gz.sha256
            ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst
            ${{ matrix.flavor }}-${{ matrix.arch }}-initramfs.cpio.zst.sha256
          if-no-files-found: ignore

  sbom:
    name: Generate SBOM
    needs: [build, iso]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false

      - id: sbom-attempt-1
        name: Generate SBOM (attempt 1)
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: release-artifacts
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Wait before SBOM retry (attempt 2)
        if: steps.sbom-attempt-1.outcome == 'failure'
        run: sleep 15

      - id: sbom-attempt-2
        name: Generate SBOM (attempt 2)
        if: steps.sbom-attempt-1.outcome == 'failure'
        continue-on-error: true
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: release-artifacts
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Wait before SBOM retry (attempt 3)
        if: steps.sbom-attempt-1.outcome == 'failure' && steps.sbom-attempt-2.outcome == 'failure'
        run: sleep 30

      - id: sbom-attempt-3
        name: Generate SBOM (attempt 3)
        if: steps.sbom-attempt-1.outcome == 'failure' && steps.sbom-attempt-2.outcome == 'failure'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c
        with:
          path: release-artifacts
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SBOM checksum
        run: |
          if [ ! -s sbom.spdx.json ]; then
            echo "::error::SBOM generation did not produce sbom.spdx.json"
            exit 1
          fi
          sha256sum sbom.spdx.json > sbom.spdx.json.sha256
          if [ ! -s sbom.spdx.json.sha256 ]; then
            echo "::error::SBOM checksum generation did not produce sbom.spdx.json.sha256"
            exit 1
          fi

      - name: Upload SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sbom
          path: |
            sbom.spdx.json
            sbom.spdx.json.sha256
          if-no-files-found: error

  scan:
    name: Vulnerability Scan
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: release-*
          path: release-artifacts
          merge-multiple: false

      - name: Install scan extraction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cpio gzip zstd

      - name: Extract initramfs artifacts
        run: bash hack/extract-initramfs-artifacts.sh release-artifacts scan-rootfs

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: scan-rootfs
          severity: CRITICAL,HIGH
          exit-code: 1
          format: table

  sign:
    name: Sign Artifacts
    needs: [build, iso, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Sign checksums with Cosign
        run: |
          mapfile -d '' -t checksums < <(find artifacts -type f -name "*.sha256" -print0 | sort -z)
          if [ "${#checksums[@]}" -eq 0 ]; then
            echo "::error::no checksum files found to sign"
            find artifacts -maxdepth 3 -type f -print || true
            exit 1
          fi
          for f in "${checksums[@]}"; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --bundle "${f}.bundle" \
              "$f"
          done

      - name: Upload signatures
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: signatures
          path: |
            artifacts/**/*.sig
            artifacts/**/*.bundle
          if-no-files-found: error

  container:
    name: Container Image (${{ matrix.flavor }}/${{ matrix.arch }})
    needs: [build, scan]
    strategy:
      matrix:
        include:
          - flavor: default
            arch: amd64
            runner: ubuntu-latest
          - flavor: default
            arch: arm64
            runner: ubuntu-24.04-arm
          - flavor: gobgp
            arch: amd64
            runner: ubuntu-latest
          - flavor: gobgp
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push per-arch image
        run: |
          retry_ghcr() {
            local description="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::${description} failed after ${attempt} attempts"
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::${description} failed; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          ensure_container_ref_absent() {
            local ref="$1"
            local attempt err
            for attempt in 1 2 3 4 5; do
              err="${RUNNER_TEMP}/container-ref-check-${attempt}.err"
              if docker buildx imagetools inspect "${ref}" >/dev/null 2>"${err}"; then
                echo "::error::container image ${ref} already exists; refusing to overwrite"
                return 1
              fi
              if grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::could not verify container image ${ref} is absent"
                cat "${err}" >&2 || true
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::could not verify container image ${ref}; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          VERSION=${GITHUB_REF_NAME#v}
          TARGET_ARG=""
          BUILD_FLAVOR="${{ matrix.flavor }}"
          if [ "${BUILD_FLAVOR}" = "default" ]; then
            BUILD_FLAVOR="full"
          fi
          IMAGE_TAG="${VERSION}"
          if [ "${{ matrix.flavor }}" = "gobgp" ]; then
            TARGET_ARG="--target=gobgp"
            IMAGE_TAG="${VERSION}-gobgp"
          fi
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REF="${IMAGE}:${IMAGE_TAG}-${{ matrix.arch }}"
          ensure_container_ref_absent "${REF}"
          retry_ghcr "build and publish ${REF}" docker buildx build \
            ${TARGET_ARG} \
            --platform "linux/${{ matrix.arch }}" \
            --build-arg "BOOTY_VERSION=${VERSION}" \
            --build-arg "BOOTY_BUILD=${{ github.sha }}" \
            --build-arg "BOOTY_FLAVOR=${BUILD_FLAVOR}" \
            --provenance=true \
            --push \
            -t "${REF}" \
            -f initrd.Dockerfile .

  container-sign:
    name: Sign Container Image (${{ matrix.flavor }}/${{ matrix.arch }})
    needs: container
    strategy:
      matrix:
        include:
          - flavor: default
            arch: amd64
          - flavor: default
            arch: arm64
          - flavor: gobgp
            arch: amd64
          - flavor: gobgp
            arch: arm64
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign per-arch image
        run: |
          retry_ghcr() {
            local description="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::${description} failed after ${attempt} attempts"
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::${description} failed; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          VERSION=${GITHUB_REF_NAME#v}
          IMAGE_TAG="${VERSION}"
          if [ "${{ matrix.flavor }}" = "gobgp" ]; then
            IMAGE_TAG="${VERSION}-gobgp"
          fi
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          retry_ghcr "sign ${IMAGE}:${IMAGE_TAG}-${{ matrix.arch }}" \
            cosign sign --yes "${IMAGE}:${IMAGE_TAG}-${{ matrix.arch }}"

  container-manifest:
    name: Container Manifest (${{ matrix.flavor }})
    needs: container-sign
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        flavor: [default, gobgp]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003

      - name: Create and push multi-arch manifest
        run: |
          ensure_container_ref_absent() {
            local ref="$1"
            local attempt err
            for attempt in 1 2 3 4 5; do
              err="${RUNNER_TEMP}/container-manifest-ref-check-${attempt}.err"
              if docker buildx imagetools inspect "${ref}" >/dev/null 2>"${err}"; then
                echo "::error::container image ${ref} already exists; refusing to overwrite"
                return 1
              fi
              if grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::could not verify container image ${ref} is absent"
                cat "${err}" >&2 || true
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::could not verify container image ${ref}; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          retry_ghcr() {
            local description="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::${description} failed after ${attempt} attempts"
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::${description} failed; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          VERSION=${GITHUB_REF_NAME#v}
          IMAGE_TAG="${VERSION}"
          if [ "${{ matrix.flavor }}" = "gobgp" ]; then
            IMAGE_TAG="${VERSION}-gobgp"
          fi
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          REF="${IMAGE}:${IMAGE_TAG}"
          ensure_container_ref_absent "${REF}"
          retry_ghcr "create container manifest ${REF}" docker buildx imagetools create \
            -t "${REF}" \
            "${IMAGE}:${IMAGE_TAG}-amd64" \
            "${IMAGE}:${IMAGE_TAG}-arm64"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign container image
        run: |
          retry_ghcr() {
            local description="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::${description} failed after ${attempt} attempts"
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::${description} failed; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          VERSION=${GITHUB_REF_NAME#v}
          IMAGE_TAG="${VERSION}"
          if [ "${{ matrix.flavor }}" = "gobgp" ]; then
            IMAGE_TAG="${VERSION}-gobgp"
          fi
          IMAGE=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]'):${IMAGE_TAG}
          retry_ghcr "sign ${IMAGE}" cosign sign --yes "${IMAGE}"

  iso:
    name: ISO (${{ matrix.flavor }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      matrix:
        include:
          - flavor: default
            target: iso
            output: booty.iso
            artifact: booty-amd64.iso
          - flavor: gobgp
            target: gobgp-iso
            output: booty-gobgp.iso
            artifact: booty-gobgp-amd64.iso
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003

      - name: Build ISO
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          BUILD_FLAVOR="${{ matrix.flavor }}"
          if [ "${BUILD_FLAVOR}" = "default" ]; then
            BUILD_FLAVOR="full"
          fi
          docker buildx build \
            --target ${{ matrix.target }} \
            --platform linux/amd64 \
            --build-arg "BOOTY_VERSION=${VERSION}" \
            --build-arg "BOOTY_BUILD=${{ github.sha }}" \
            --build-arg "BOOTY_FLAVOR=${BUILD_FLAVOR}" \
            --output type=local,dest=out-iso \
            -f initrd.Dockerfile .
          mv out-iso/${{ matrix.output }} ${{ matrix.artifact }}

      - name: Generate checksums
        run: sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - name: Upload ISO artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-iso-${{ matrix.flavor }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256
          if-no-files-found: error

  iso-oci:
    name: ISO OCI (${{ matrix.flavor }})
    needs: [iso, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include:
          - flavor: default
            artifact: booty-amd64.iso
            tag_suffix: ""
          - flavor: gobgp
            artifact: booty-gobgp-amd64.iso
            tag_suffix: "-gobgp"
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: "1.3.1"

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ISO artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-iso-${{ matrix.flavor }}

      - name: Push ISO as OCI artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}-iso" | tr '[:upper:]' '[:lower:]')
          REF="${REPO}:${VERSION}${{ matrix.tag_suffix }}"
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          err="${RUNNER_TEMP}/oras-ref-check.err"
          if oras manifest fetch "${REF}" >/dev/null 2>"${err}"; then
            echo "::error::OCI artifact ${REF} already exists; refusing to overwrite"
            exit 1
          fi
          if ! grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
            echo "::error::could not verify OCI artifact ${REF} is absent"
            cat "${err}" >&2 || true
            exit 1
          fi

          oras push "${REF}" \
            --artifact-type application/vnd.booty.iso.v1 \
            --annotation "org.opencontainers.image.title=BOOTy ISO (${{ matrix.flavor }})" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.created=${CREATED}" \
            --annotation "org.opencontainers.image.url=${RUN_URL}" \
            --annotation "io.booty.flavor=${{ matrix.flavor }}" \
            --annotation "io.booty.arch=amd64" \
            --annotation "io.booty.github.run_id=${{ github.run_id }}" \
            --annotation "io.booty.github.run_attempt=${{ github.run_attempt }}" \
            "${{ matrix.artifact }}:application/octet-stream"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Sign OCI artifact
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}-iso" | tr '[:upper:]' '[:lower:]')
          cosign sign --yes "${REPO}:${VERSION}${{ matrix.tag_suffix }}"

  changelog:
    name: Generate Changelog
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG.md

      - name: Upload changelog
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: changelog
          path: CHANGELOG.md
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [validate-tag, build, iso, iso-oci, sbom, scan, sign, container-manifest, changelog, oci-artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir release-files
          find artifacts -type f \( -name "booty-*" -o -name "*.cpio.gz" -o -name "*.cpio.zst" -o -name "*.iso" -o -name "*.sha256" -o -name "*.sig" -o -name "*.bundle" -o -name "*.spdx.json" \) \
            -exec cp {} release-files/ \;
          ls -lh release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          body_path: artifacts/changelog/CHANGELOG.md
          files: release-files/*
          prerelease: ${{ needs.validate-tag.outputs.prerelease }}
          make_latest: ${{ needs.validate-tag.outputs.make_latest }}
          overwrite_files: false

  oci-artifacts:
    name: Publish OCI Artifacts (${{ matrix.arch }})
    needs: [build, sbom, sign, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Install ORAS
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: "1.3.1"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: artifacts

      - name: Publish initramfs artifacts
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          retry_ghcr() {
            local description="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::${description} failed after ${attempt} attempts"
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::${description} failed; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          ensure_oci_ref_absent() {
            local ref="$1"
            local attempt err
            for attempt in 1 2 3 4 5; do
              err="${RUNNER_TEMP}/oras-ref-check-${attempt}.err"
              if oras manifest fetch "${ref}" >/dev/null 2>"${err}"; then
                echo "::error::OCI artifact ${ref} already exists; refusing to overwrite"
                return 1
              fi
              if grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::could not verify OCI artifact ${ref} is absent"
                cat "${err}" >&2 || true
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::could not verify OCI artifact ${ref}; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          for flavor in default gobgp slim micro; do
            # gobgp, default, and slim use zstd compression; micro uses gzip.
            if [ "${flavor}" = "gobgp" ] || [ "${flavor}" = "default" ] || [ "${flavor}" = "slim" ]; then
              EXT="cpio.zst"
              MEDIA_TYPE="application/vnd.cncf.initramfs.layer.v1+zstd"
            else
              EXT="cpio.gz"
              MEDIA_TYPE="application/vnd.cncf.initramfs.layer.v1+gzip"
            fi
            INITRAMFS="artifacts/release-${flavor}-${{ matrix.arch }}/${flavor}-${{ matrix.arch }}-initramfs.${EXT}"
            CHECKSUM="artifacts/release-${flavor}-${{ matrix.arch }}/${flavor}-${{ matrix.arch }}-initramfs.${EXT}.sha256"

            if [ ! -f "${INITRAMFS}" ]; then
              echo "::error::missing initramfs artifact ${INITRAMFS}"
              exit 1
            fi
            if [ ! -f "${CHECKSUM}" ]; then
              echo "::error::missing initramfs checksum ${CHECKSUM}"
              exit 1
            fi

            TAG="${VERSION}-${flavor}-${{ matrix.arch }}"
            REF="${REPO}/initramfs:${TAG}"
            ensure_oci_ref_absent "${REF}"
            echo "Publishing ${REF}"

            args=("${INITRAMFS}:${MEDIA_TYPE}" "${CHECKSUM}:text/plain")

            retry_ghcr "publish OCI artifact ${REF}" oras push "${REF}" \
              --artifact-type application/vnd.booty.initramfs.v1 \
              --annotation "org.opencontainers.image.title=BOOTy initramfs (${flavor}/${{ matrix.arch }})" \
              --annotation "org.opencontainers.image.version=${VERSION}" \
              --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
              --annotation "org.opencontainers.image.created=${CREATED}" \
              --annotation "org.opencontainers.image.url=${RUN_URL}" \
              --annotation "io.booty.flavor=${flavor}" \
              --annotation "io.booty.arch=${{ matrix.arch }}" \
              --annotation "io.booty.github.run_id=${{ github.run_id }}" \
              --annotation "io.booty.github.run_attempt=${{ github.run_attempt }}" \
              "${args[@]}"
            retry_ghcr "sign OCI artifact ${REF}" cosign sign --yes "${REF}"
          done

      - name: Publish binary artifact
        run: |
          retry_ghcr() {
            local description="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::${description} failed after ${attempt} attempts"
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::${description} failed; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BINARY="artifacts/release-default-${{ matrix.arch }}/booty-${{ matrix.arch }}"
          CHECKSUM="artifacts/release-default-${{ matrix.arch }}/booty-${{ matrix.arch }}.sha256"

          if [ ! -f "${BINARY}" ]; then
            echo "::error::missing binary artifact ${BINARY}"
            exit 1
          fi
          if [ ! -f "${CHECKSUM}" ]; then
            echo "::error::missing binary checksum ${CHECKSUM}"
            exit 1
          fi

          TAG="${VERSION}-${{ matrix.arch }}"
          REF="${REPO}/binary:${TAG}"

          err="${RUNNER_TEMP}/oras-ref-check.err"
          if oras manifest fetch "${REF}" >/dev/null 2>"${err}"; then
            echo "::error::OCI artifact ${REF} already exists; refusing to overwrite"
            exit 1
          fi
          if ! grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
            echo "::error::could not verify OCI artifact ${REF} is absent"
            cat "${err}" >&2 || true
            exit 1
          fi

          echo "Publishing ${REF}"

          args=("${BINARY}:application/vnd.cncf.binary.layer.v1" "${CHECKSUM}:text/plain")

          retry_ghcr "publish OCI artifact ${REF}" oras push "${REF}" \
            --artifact-type application/vnd.booty.binary.v1 \
            --annotation "org.opencontainers.image.title=BOOTy binary (${{ matrix.arch }})" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.created=${CREATED}" \
            --annotation "org.opencontainers.image.url=${RUN_URL}" \
            --annotation "io.booty.arch=${{ matrix.arch }}" \
            --annotation "io.booty.github.run_id=${{ github.run_id }}" \
            --annotation "io.booty.github.run_attempt=${{ github.run_attempt }}" \
            "${args[@]}"
          retry_ghcr "sign OCI artifact ${REF}" cosign sign --yes "${REF}"

      - name: Publish SBOM artifact
        if: matrix.arch == 'amd64'
        run: |
          retry_ghcr() {
            local description="$1"
            shift
            local attempt
            for attempt in 1 2 3 4 5; do
              if "$@"; then
                return 0
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "::error::${description} failed after ${attempt} attempts"
                return 1
              fi
              delay=$((attempt * 5))
              echo "::warning::${description} failed; retrying in ${delay}s"
              sleep "${delay}"
            done
          }

          VERSION=${GITHUB_REF_NAME#v}
          REPO=$(echo "ghcr.io/${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          CREATED=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SBOM="artifacts/sbom/sbom.spdx.json"

          if [ ! -f "${SBOM}" ]; then
            echo "::error::missing SBOM artifact ${SBOM}"
            exit 1
          fi

          REF="${REPO}/sbom:${VERSION}"
          err="${RUNNER_TEMP}/oras-ref-check.err"
          if oras manifest fetch "${REF}" >/dev/null 2>"${err}"; then
            echo "::error::OCI artifact ${REF} already exists; refusing to overwrite"
            exit 1
          fi
          if ! grep -Eiq '(not found|manifest unknown|name unknown|404)' "${err}"; then
            echo "::error::could not verify OCI artifact ${REF} is absent"
            cat "${err}" >&2 || true
            exit 1
          fi

          echo "Publishing ${REF}"
          retry_ghcr "publish OCI artifact ${REF}" oras push "${REF}" \
            --artifact-type application/vnd.booty.sbom.v1 \
            --annotation "org.opencontainers.image.title=BOOTy SBOM" \
            --annotation "org.opencontainers.image.version=${VERSION}" \
            --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation "org.opencontainers.image.created=${CREATED}" \
            --annotation "org.opencontainers.image.url=${RUN_URL}" \
            --annotation "io.booty.github.run_id=${{ github.run_id }}" \
            --annotation "io.booty.github.run_attempt=${{ github.run_attempt }}" \
            "${SBOM}:application/spdx+json"
          retry_ghcr "sign OCI artifact ${REF}" cosign sign --yes "${REF}"
