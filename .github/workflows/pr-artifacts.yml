name: PR Artifact Publishing

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: pr-artifacts-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  publish-pr-iso:
    name: Publish PR BOOTy ISO artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Explain fork PR artifact policy
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          {
            echo "### PR ISO artifact"
            echo
            echo "Skipped: PR ISO artifact publishing is disabled for fork pull requests."
            echo "Fork PRs are still validated by the regular CI workflows, but BOOTy does not publish bootable ISO artifacts from untrusted fork heads."
            echo
            echo "For trusted artifact publication, push the branch in this repository or run this workflow manually from a reviewed ref."
          } >> "${GITHUB_STEP_SUMMARY}"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Set up Docker Buildx
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build ISO artifacts
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Commit time: reproducible ISOs per commit, distinct IDs per commit.
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          build_iso() {
            flavor="$1"
            target="$2"
            output="$3"
            limit_mib="$4"
            out_dir="out-${flavor}-iso"

            docker buildx build --platform linux/amd64 --target "${target}" \
              --build-arg "BOOTY_VERSION=pr" \
              --build-arg "BOOTY_BUILD=${HEAD_SHA}" \
              --build-arg "BOOTY_COMMIT_TIME=$(git log -1 --format=%cI)" \
              --build-arg "BOOTY_FLAVOR=${flavor}" \
              --build-arg "SOURCE_DATE_EPOCH=${SOURCE_DATE_EPOCH}" \
              --output "type=local,dest=${out_dir}" -f initrd.Dockerfile .

            test -f "${out_dir}/${output}"
            max_iso_bytes=$((limit_mib * 1024 * 1024))
            iso_bytes=$(stat -c%s "${out_dir}/${output}")
            echo "${flavor} ISO size: $(numfmt --to=iec "$iso_bytes")"
            if [ "$iso_bytes" -gt "$max_iso_bytes" ]; then
              echo "::error::${flavor} ISO is $(numfmt --to=iec "$iso_bytes"), above hard cap $(numfmt --to=iec "$max_iso_bytes")"
              exit 1
            fi
            sha256sum "${out_dir}/${output}" > "${out_dir}/${output}.sha256"
          }

          build_iso full iso booty.iso 180
          build_iso gobgp gobgp-iso booty-gobgp.iso 140

          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import pathlib

          artifacts = []
          for flavor, path in (
              ("default", pathlib.Path("out-full-iso/booty.iso")),
              ("gobgp", pathlib.Path("out-gobgp-iso/booty-gobgp.iso")),
          ):
              artifacts.append(
                  {
                      "flavor": flavor,
                      "name": path.name,
                      "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
                      "size": path.stat().st_size,
                  }
              )
          document = {
              "artifact": "booty-pr-isos",
              "head_sha": os.environ["HEAD_SHA"],
              "github_sha": os.environ["MERGE_SHA"],
              "checked_out_sha": os.popen("git rev-parse HEAD").read().strip(),
              "repository": os.environ["GITHUB_REPOSITORY"],
              "workflow": os.environ["GITHUB_WORKFLOW"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "isos": artifacts,
          }
          pathlib.Path("booty-pr-artifacts.json").write_text(
              json.dumps(document, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Package GitLab generic artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import zipfile

          archive_path = pathlib.Path("booty-pr-isos.zip")
          artifacts = (
              pathlib.Path("out-full-iso/booty.iso"),
              pathlib.Path("out-full-iso/booty.iso.sha256"),
              pathlib.Path("out-gobgp-iso/booty-gobgp.iso"),
              pathlib.Path("out-gobgp-iso/booty-gobgp.iso.sha256"),
              pathlib.Path("booty-pr-artifacts.json"),
          )

          with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
              for artifact in artifacts:
                  if not artifact.is_file() or artifact.is_symlink():
                      raise SystemExit(f"{artifact} must be a regular non-symlink file")
                  archive.write(artifact, artifact.name)
          PY

      - name: Publish artifact
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: booty-pr-isos
          path: |
            out-full-iso/booty.iso
            out-full-iso/booty.iso.sha256
            out-gobgp-iso/booty-gobgp.iso
            out-gobgp-iso/booty-gobgp.iso.sha256
            booty-pr-artifacts.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitLab generic package
        if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GITLAB_PACKAGE_TOKEN: ${{ secrets.GITLAB_PACKAGE_TOKEN }}
          GITLAB_PACKAGE_REQUIRED: ${{ vars.GITLAB_PACKAGE_REQUIRED || 'false' }}
          GITLAB_API_V4_URL: ${{ vars.GITLAB_API_V4_URL || 'https://gitlab.devops.telekom.de/api/v4' }}
          GITLAB_PACKAGE_PROJECT_ID: ${{ vars.GITLAB_PACKAGE_PROJECT_ID || '278324' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          version="${HEAD_SHA:0:7}"
          package_url="${GITLAB_API_V4_URL}/projects/${GITLAB_PACKAGE_PROJECT_ID}/packages/generic/booty-pr-artifacts/${version}/booty-pr-isos.zip"
          required="$(printf '%s' "${GITLAB_PACKAGE_REQUIRED}" | tr '[:upper:]' '[:lower:]')"
          if [ -z "${GITLAB_PACKAGE_TOKEN}" ]; then
            if [ "${required}" = "true" ] || [ "${required}" = "1" ] || [ "${required}" = "yes" ]; then
              echo "::error::GITLAB_PACKAGE_REQUIRED is true, but GITLAB_PACKAGE_TOKEN is not configured."
              exit 1
            fi
            echo "::notice::GITLAB_PACKAGE_TOKEN is not configured; GitLab generic package publish is optional and was skipped."
            {
              echo "### GitLab generic package"
              echo
              echo "Skipped: \`GITLAB_PACKAGE_TOKEN\` is not configured."
              echo "Set repository variable \`GITLAB_PACKAGE_REQUIRED=true\` to make this a required publishing target."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          curl --fail --silent --show-error \
            --header "PRIVATE-TOKEN: ${GITLAB_PACKAGE_TOKEN}" \
            --upload-file booty-pr-isos.zip \
            "${package_url}"
          {
            echo "### GitLab generic package"
            echo
            echo "Published: \`${package_url}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Note GitLab package publish scope
        if: github.event_name == 'pull_request'
        run: |
          {
            echo "### GitLab generic package"
            echo
            echo "Skipped for pull requests; run this workflow manually to publish a GitLab package."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Note GitLab package publish ref guard
        if: github.event_name == 'workflow_dispatch' && github.ref != format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          {
            echo "### GitLab generic package"
            echo
            echo "Skipped: GitLab package publishing is only available when this workflow is dispatched from the default branch."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Print download hint
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          ENCODED_REF=$(python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['REF_NAME'], safe=''))")
          echo "nightly.link URL (latest artifact on branch):"
          echo "https://nightly.link/${{ github.repository }}/workflows/pr-artifacts.yml/${ENCODED_REF}/booty-pr-isos.zip"
