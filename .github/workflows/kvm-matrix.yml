name: KVM Test Matrix

on:
  push:
    branches: [main]
    paths:
      - "pkg/secureboot/**"
      - "pkg/disk/**"
      - "pkg/tpm/**"
      - "pkg/kexec/**"
      - "pkg/buildinfo/**"
      - "pkg/efi/**"
      - "pkg/system/**"
      - "pkg/caprf/**"
      - "pkg/cloudinit/**"
      - "pkg/config/**"
      - "pkg/crash/**"
      - "pkg/debug/**"
      - "pkg/executil/**"
      - "pkg/firmware/**"
      - "pkg/health/**"
      - "pkg/inventory/**"
      - "pkg/provision/**"
      - "pkg/rescue/**"
      - "pkg/runmode/**"
      - "pkg/realm/**"
      - "pkg/watchdog/**"
      - "pkg/image/**"
      - "pkg/network/**"
      - "pkg/ux/**"
      - "pkg/oob/**"
      - "oob_status.go"
      - "pkg/timesync/**"
      - "go.mod"
      - "go.sum"
      - "main.go"
      - "initrd.Dockerfile"
      - "test/e2e/assets/busybox/**"
      - "test/e2e/kvm/**"
      - ".github/workflows/kvm-matrix.yml"
  pull_request:
    paths:
      - "pkg/secureboot/**"
      - "pkg/disk/**"
      - "pkg/tpm/**"
      - "pkg/kexec/**"
      - "pkg/buildinfo/**"
      - "pkg/efi/**"
      - "pkg/system/**"
      - "pkg/caprf/**"
      - "pkg/cloudinit/**"
      - "pkg/config/**"
      - "pkg/crash/**"
      - "pkg/debug/**"
      - "pkg/executil/**"
      - "pkg/firmware/**"
      - "pkg/health/**"
      - "pkg/inventory/**"
      - "pkg/provision/**"
      - "pkg/rescue/**"
      - "pkg/runmode/**"
      - "pkg/realm/**"
      - "pkg/watchdog/**"
      - "pkg/image/**"
      - "pkg/network/**"
      - "pkg/ux/**"
      - "pkg/oob/**"
      - "oob_status.go"
      - "pkg/timesync/**"
      - "go.mod"
      - "go.sum"
      - "main.go"
      - "initrd.Dockerfile"
      - "test/e2e/assets/busybox/**"
      - "test/e2e/kvm/**"
      - ".github/workflows/kvm-matrix.yml"
  workflow_dispatch:

permissions:
  contents: read
  # Read the cycle timing report of main as the baseline.
  actions: read

jobs:
  kvm-tests:
    name: KVM ${{ matrix.scenario }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes || 75 }}
    strategy:
      matrix:
        include:
          - scenario: secureboot-smoke
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestUEFISecureBootSmoke
            ovmf_vars: OVMF_VARS.fd
            ovmf_code: /usr/share/OVMF/OVMF_CODE_4M.secboot.fd
            setup: |
              cp /usr/share/OVMF/OVMF_VARS_4M.fd OVMF_VARS.fd
          - scenario: luks
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestLUKSSmokeQEMU
            luks_disk: test-disk.qcow2
            setup: |
              qemu-img create -f qcow2 test-disk.qcow2 10G
          - scenario: tpm
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestTPMSmokeQEMU
            setup: ""
          # Provisions a target and kexecs into it, under SeaBIOS and OVMF.
          - scenario: kexec
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestKexecSmokeQEMU$"
            privileged: true
            setup: ""
          - scenario: kexec-persist
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestKexecHandoffPersistsTargetWritesQEMU$"
            privileged: true
            setup: ""
          - scenario: ab-sysext-preload
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestABProvisionPreloadsSysextsWithoutActivatingVM
            privileged: true
            setup: ""
          - scenario: ab-preserve-existing
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestABPreserveExistingUpgradeKeepsActiveSlotAndWritesInactiveVM
            privileged: true
            setup: ""
          - scenario: system-ab-preserve-existing
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestSystemABPreserveExistingKeepsSharedVarVM
            privileged: true
            setup: ""
          - scenario: flatcar-like-usra-system-ab
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestFlatcarLikeUSRASourceCanProvisionSystemABVM
            privileged: true
            setup: ""
          - scenario: crash-artifacts
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestCrashArtifactsStartupUploadBeforeImageDownload
            privileged: true
            setup: ""
          - scenario: caprf-legacy-compat
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestLegacyCompat"
            privileged: true
            setup: ""
            # About 1.5 minutes per QEMU run and more than ten runs.
            go_timeout: 40m
          - scenario: caprf-native-parity
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestNativeParity"
            privileged: true
            setup: ""
            # More than ten QEMU runs, some of them wait for minutes.
            go_timeout: 40m
          - scenario: time-sync
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestTimeSync.*QEMU$"
            privileged: true
            setup: ""
            # Three QEMU runs with the guest RTC in 2001.
            go_timeout: 25m
          - scenario: disk-wipe
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestDiskWipe.*QEMU$"
            privileged: true
            setup: ""
          - scenario: standby-agent
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestStandby.*QEMU$"
            privileged: true
            setup: ""
          - scenario: hardware-watchdog
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestWatchdog.*QEMU$"
            privileged: true
            setup: ""
            # Two QEMU runs with an i6300esb watchdog.
            go_timeout: 25m
          # Times a deprovision + provision cycle, cold (two ISO boots) and
          # through the standby agent. Writes cycle-timing.json and the job
          # summary, compared with the report of main.
          - scenario: agent-cycle-timing
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestAgentCycleTimingQEMU$"
            privileged: true
            setup: ""
          - scenario: rescue-retry-stale-mounts
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestRescueRetryReleasesStaleMountsQEMU$"
            privileged: true
            setup: ""
          - scenario: network-persistence-static-ip
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestNetworkPersistenceStaticIP$"
            privileged: true
            setup: ""
          - scenario: disk-links-root-uuid
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestDiskLinksRootUUIDSurvivesDiskOrderQEMU$"
            privileged: true
            setup: ""
          - scenario: predictable-nic-names
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestPredictableNICNamesQEMU$"
            privileged: true
            setup: ""
          - scenario: flavor-storage-controllers
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestFlavorInitrdStorageControllersQEMU$"
            privileged: true
            # The default flavor and its Debian kernel, built from initrd.Dockerfile.
            setup: |
              docker buildx build --platform linux/amd64 --build-arg "BOOTY_COMMIT_TIME=$(git log -1 --format=%cI)" --output type=local,dest=out-flavor -f initrd.Dockerfile .
              docker buildx build --platform linux/amd64 --build-arg "BOOTY_COMMIT_TIME=$(git log -1 --format=%cI)" --target kernel-image --output type=local,dest=out-flavor -f initrd.Dockerfile .
          # Boots the runner kernel (efivarfs built in). The BOOTy kernel with
          # efivarfs.ko is covered by flavor-storage-controllers under OVMF.
          - scenario: uefi-efi-entries
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestUEFIEFIBootEntry"
            privileged: true
            setup: ""
          # Forced network failure under OVMF: the BOOTY1 console line and the
          # BootyLastResult variable, read again after a reboot (NVRAM persists).
          - scenario: oob-status
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestOOBStatus"
            privileged: true
            setup: ""
          - scenario: production-templates
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestProdTplTemplatesQEMU$"
            privileged: true
            setup: ""
          - scenario: bootloader-smoke
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestUEFIBootPathSmoke
            ovmf_vars: OVMF_VARS.fd
            ovmf_code: /usr/share/OVMF/OVMF_CODE_4M.fd
            setup: |
              cp /usr/share/OVMF/OVMF_VARS_4M.fd OVMF_VARS.fd
          - scenario: iso-headless-q35
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestISOBootHeadlessQ35$"
            setup: ""
          - scenario: mirror-boot-failover
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestMirroredRootBootFailoverVM$"
            # Two subtests of at most 8 + 6 + 6 minutes plus image preparation.
            test_timeout: 50m
            timeout_minutes: 70
            privileged: true
            ovmf_vars: OVMF_VARS.fd
            ovmf_code: /usr/share/OVMF/OVMF_CODE_4M.fd
            # Ubuntu 22.04 cloud image: root + ESP layout with mdadm, initramfs-tools and efibootmgr.
            mirror_os_image: ubuntu-22.04-server-cloudimg-amd64.img
            mirror_os_image_url: https://cloud-images.ubuntu.com/releases/jammy/release-20260926/ubuntu-22.04-server-cloudimg-amd64.img
            mirror_os_image_sha256: 0c9811a81e6329acacbb5ae4e701a7650f85cd3f19852cd159d79ab8357b210e
            setup: |
              cp /usr/share/OVMF/OVMF_VARS_4M.fd OVMF_VARS.fd
              sudo apt-get install -y --no-install-recommends cloud-guest-utils efibootmgr
          - scenario: mirror-boot-failover-separate-boot
            qemu_extra: ""
            test_tag: e2e
            test_regex: "^TestMirroredRootBootFailoverVM$"
            # Two subtests of at most 8 + 6 + 6 minutes plus image preparation.
            test_timeout: 50m
            timeout_minutes: 70
            privileged: true
            ovmf_vars: OVMF_VARS.fd
            ovmf_code: /usr/share/OVMF/OVMF_CODE_4M.fd
            # Ubuntu 24.04 cloud image: separate /boot partition mirrored as md1.
            mirror_os_image: ubuntu-24.04-server-cloudimg-amd64.img
            mirror_os_image_url: https://cloud-images.ubuntu.com/releases/noble/release-20260911/ubuntu-24.04-server-cloudimg-amd64.img
            mirror_os_image_sha256: 612b2c0cc1bc413a6cb8c38fd611794caf0f2b436c50013d8b3794db12ad7354
            mirror_separate_boot: "true"
            mirror_root_partition_number: "1"
            mirror_disk_size: 6G
            setup: |
              cp /usr/share/OVMF/OVMF_VARS_4M.fd OVMF_VARS.fd
              sudo apt-get install -y --no-install-recommends cloud-guest-utils efibootmgr
          - scenario: luks-verify
            qemu_extra: ""
            test_tag: e2e
            test_regex: TestLUKSVerifyHeader
            luks_disk: test-luks.qcow2
            setup: |
              sudo apt-get install -y qemu-utils cryptsetup
              qemu-img create -f qcow2 test-luks.qcow2 2G
              sudo modprobe nbd max_part=8
              nbd_dev=""
              for candidate in /dev/nbd{0..15}; do
                if sudo qemu-nbd --connect="${candidate}" test-luks.qcow2; then
                  nbd_dev="${candidate}"
                  break
                fi
              done
              if [ -z "${nbd_dev}" ]; then
                echo "No free NBD device available for LUKS setup" >&2
                exit 1
              fi
              wait_luks_nbd_disconnect() {
                local dev="$1"
                local pid_file="/sys/block/${dev##*/}/pid"
                local deadline=$((SECONDS + 5))
                local pid=""
                while [ "${SECONDS}" -lt "${deadline}" ]; do
                  pid="$(cat "${pid_file}" 2>/dev/null | tr -d '[:space:]' || true)"
                  if [ -z "${pid}" ] || [ "${pid}" = "0" ]; then
                    return 0
                  fi
                  sleep 0.1
                done
                echo "Timed out waiting for ${dev} to disconnect" >&2
                return 1
              }
              disconnect_luks_nbd() {
                sudo qemu-nbd --disconnect "${nbd_dev}" >/dev/null 2>&1 || true
                wait_luks_nbd_disconnect "${nbd_dev}"
              }
              cleanup_luks_nbd() {
                sudo cryptsetup luksClose testcrypt >/dev/null 2>&1 || true
                disconnect_luks_nbd || true
              }
              trap cleanup_luks_nbd EXIT
              echo -n "booty-test" | sudo cryptsetup luksFormat "${nbd_dev}" -
              echo -n "booty-test" | sudo cryptsetup luksOpen "${nbd_dev}" testcrypt -
              sudo mkfs.ext4 /dev/mapper/testcrypt
              sudo cryptsetup luksClose testcrypt
              disconnect_luks_nbd
              trap - EXIT
      fail-fast: false

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install KVM dependencies
        # A slow mirror should fail this step fast instead of eating the job budget.
        timeout-minutes: 15
        run: |
          # GitHub runner images can carry Microsoft/Azure apt sources that intermittently return 403.
          # Remove only those optional source snippets so unrelated package installs stay reliable.
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -delete
          apt_opts=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_opts[@]}" update
          # Keep the runner kernel (the /boot/vmlinuz-*-azure image sorts first).
          # The "Prepare kernel" step downloads a kernel package if /boot has none.
          sudo DEBIAN_FRONTEND=noninteractive apt-get "${apt_opts[@]}" install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm swtpm-tools cpio zstd busybox-static xorriso isolinux syslinux-common fdisk util-linux e2fsprogs dosfstools parted mdadm lvm2 gdisk cloud-guest-utils efibootmgr nvme-cli hdparm

      - name: Load KVM network modules
        run: |
          # The production-template guest boots the runner kernel directly and
          # receives its module files through addProdTplModules. Ensure the
          # host has the matching VRF/VXLAN modules available for that copy.
          if ! sudo modprobe vrf; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe vrf
          fi
          sudo modprobe vxlan

      - name: Cache mirror OS image
        if: matrix.mirror_os_image != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.mirror_os_image }}
          key: mirror-os-image-${{ matrix.mirror_os_image_sha256 }}

      - name: Fetch mirror OS image
        if: matrix.mirror_os_image != ''
        env:
          IMAGE_FILE: ${{ matrix.mirror_os_image }}
          IMAGE_URL: ${{ matrix.mirror_os_image_url }}
          IMAGE_SHA256: ${{ matrix.mirror_os_image_sha256 }}
        run: |
          set -euo pipefail
          if [ ! -f "${IMAGE_FILE}" ]; then
            curl -fsSL --retry 3 -o "${IMAGE_FILE}" "${IMAGE_URL}"
          fi
          echo "${IMAGE_SHA256}  ${IMAGE_FILE}" | sha256sum -c -

      - name: Scenario-specific setup
        if: matrix.setup != ''
        run: ${{ matrix.setup }}

      - name: Build BOOTy initramfs
        run: |
          set -euo pipefail
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -ldflags "-linkmode external -extldflags '-static' -s -w -X github.com/telekom/BOOTy/pkg/buildinfo.commitTime=$(git log -1 --format=%cI)" -o booty

          mkdir -p initramfs/{bin,sbin,dev,proc,run,sys,etc,tmp,usr/bin,lib/modules,mnt}
          sudo mknod initramfs/dev/console c 5 1
          sudo mknod initramfs/dev/ttyS0 c 4 64
          sudo mknod initramfs/dev/null c 1 3

          # Prefer the Dependabot-tracked Docker image, with busybox-static as a CI network fallback.
          bash test/e2e/assets/busybox/extract.sh initramfs/bin/busybox
          # Verify that busybox is statically linked to avoid non-bootable initramfs output.
          if ! file initramfs/bin/busybox | grep -Eqi 'statically linked|static-pie linked'; then
            echo "ERROR: extracted /bin/busybox is not statically linked"
            file initramfs/bin/busybox || true
            exit 1
          fi
          cd initramfs/bin
          for cmd in sh mount umount insmod setsid cttyhack chroot; do
            ln -sf busybox "$cmd"
          done
          cd ../..

          cp booty initramfs/booty
          cat > initramfs/init << 'INITEOF'
          #!/bin/sh
          exec /booty
          INITEOF
          chmod +x initramfs/init

          cd initramfs
          sudo find . -print0 | sudo cpio --null -ov --format=newc 2>/dev/null | gzip > ../test-initramfs.cpio.gz
          cd ..

      - name: Prepare kernel
        run: |
          KERNEL=$(ls /boot/vmlinuz-* 2>/dev/null | head -1)
          if [ -z "$KERNEL" ]; then
            echo "No kernel found in /boot, extracting from package"
            apt-get download linux-image-$(uname -r) 2>/dev/null || apt-get download linux-image-generic
            dpkg-deb -x linux-image*.deb /tmp/kernel-extract
            KERNEL=$(ls /tmp/kernel-extract/boot/vmlinuz-* | head -1)
          fi
          KERNEL_RELEASE=$(basename "$KERNEL" | sed 's/^vmlinuz-//')
          test -n "$KERNEL_RELEASE"
          echo "BOOTY_KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"
          sudo cp "$KERNEL" vmlinuz
          sudo chmod 644 vmlinuz

      - name: Fetch cycle timing baseline from main
        if: matrix.scenario == 'agent-cycle-timing' && github.event_name == 'pull_request'
        # Without a baseline the report has no comparison, the test still runs.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          run_id=$(gh api "repos/${REPO}/actions/artifacts?name=cycle-timing-report&per_page=100" --jq \
            '[.artifacts[] | select(.expired | not) | select(.workflow_run.head_branch == "main")
              | select(.workflow_run.head_repository_id == .workflow_run.repository_id)][0].workflow_run.id // empty')
          if [ -z "${run_id}" ]; then
            echo "No cycle timing report of main yet"
            exit 0
          fi
          gh run download "${run_id}" -R "${REPO}" -n cycle-timing-report -D cycle-baseline
          echo "BOOTY_CYCLE_BASELINE=${GITHUB_WORKSPACE}/cycle-baseline/cycle-timing.json" >> "${GITHUB_ENV}"

      - name: Run KVM test (${{ matrix.scenario }})
        run: |
          set -o pipefail
          log_file="kvm-${{ matrix.scenario }}.log"
          set +e
          list_output=$(go test -tags ${{ matrix.test_tag }} -list '${{ matrix.test_regex }}' ./test/e2e/kvm/... 2>&1)
          list_status=$?
          set -e
          if [ "$list_status" -ne 0 ]; then
            printf '%s\n' "$list_output" > "${log_file}"
            {
              echo "### KVM ${{ matrix.scenario }} test discovery failed"
              echo
              echo '```'
              echo "go test -tags ${{ matrix.test_tag }} -list '${{ matrix.test_regex }}' ./test/e2e/kvm/..."
              echo
              printf '%s\n' "$list_output"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            printf '%s\n' "$list_output"
            exit "$list_status"
          fi
          matches=$(printf '%s\n' "$list_output" | grep '^Test' || true)
          if [ -z "$matches" ]; then
            printf 'No tests matched %s with tags %s\n' '${{ matrix.test_regex }}' '${{ matrix.test_tag }}' > "${log_file}"
            {
              echo "### KVM ${{ matrix.scenario }} matched no tests"
              echo
              echo '```'
              echo "go test -tags ${{ matrix.test_tag }} -list '${{ matrix.test_regex }}' ./test/e2e/kvm/..."
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if [ "${{ matrix.privileged }}" = "true" ] || [ "${{ matrix.scenario }}" = "luks-verify" ]; then
            test_cmd=(sudo -E env "PATH=$PATH:/usr/sbin:/sbin" go test -tags ${{ matrix.test_tag }} -run ${{ matrix.test_regex }} -race -count=1 -v -timeout ${{ matrix.go_timeout || '15m' }} ./test/e2e/kvm/...)
          else
            test_cmd=(go test -tags ${{ matrix.test_tag }} -run ${{ matrix.test_regex }} -race -count=1 -v -timeout ${{ matrix.go_timeout || '15m' }} ./test/e2e/kvm/...)
          fi
          if ! "${test_cmd[@]}" 2>&1 | tee "${log_file}"; then
            {
              echo "### KVM ${{ matrix.scenario }} failed"
              echo
              echo '```'
              tail -n 120 "${log_file}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 1
          fi
          if grep -E '^[[:space:]]*--- SKIP:' "${log_file}"; then
            echo "::error::KVM ${{ matrix.scenario }} tests skipped in CI"
            exit 1
          fi
        env:
          QEMU_EXTRA_ARGS: ${{ matrix.qemu_extra }}
          BOOTY_INITRAMFS: ${{ github.workspace }}/test-initramfs.cpio.gz
          BOOTY_KERNEL: ${{ github.workspace }}/vmlinuz
          BOOTY_FLAVOR_INITRAMFS: ${{ github.workspace }}/out-flavor/initramfs.cpio.zst
          BOOTY_FLAVOR_KERNEL: ${{ github.workspace }}/out-flavor/vmlinuz
          LUKS_DISK_IMAGE: ${{ matrix.luks_disk && format('{0}/{1}', github.workspace, matrix.luks_disk) || '' }}
          OVMF_VARS: ${{ matrix.ovmf_vars && format('{0}/{1}', github.workspace, matrix.ovmf_vars) || '' }}
          OVMF_CODE: ${{ matrix.ovmf_code || '' }}
          MIRROR_OS_IMAGE: ${{ matrix.mirror_os_image && format('{0}/{1}', github.workspace, matrix.mirror_os_image) || '' }}
          MIRROR_SEPARATE_BOOT: ${{ matrix.mirror_separate_boot || '' }}
          MIRROR_ROOT_PARTITION_NUMBER: ${{ matrix.mirror_root_partition_number || '' }}
          MIRROR_DISK_SIZE: ${{ matrix.mirror_disk_size || '' }}
          BOOTY_CYCLE_REPORT: ${{ matrix.scenario == 'agent-cycle-timing' && format('{0}/cycle-timing.json', github.workspace) || '' }}
          # Repository variables: warn (default) or fail, percent, and the minimum
          # growth in seconds of the cold and of the agent cycles.
          BOOTY_CYCLE_REGRESSION_MODE: ${{ vars.BOOTY_CYCLE_REGRESSION_MODE || 'warn' }}
          BOOTY_CYCLE_REGRESSION_PCT: ${{ vars.BOOTY_CYCLE_REGRESSION_PCT || '25' }}
          BOOTY_CYCLE_REGRESSION_MIN_SECONDS: ${{ vars.BOOTY_CYCLE_REGRESSION_MIN_SECONDS || '10' }}
          BOOTY_CYCLE_REGRESSION_AGENT_MIN_SECONDS: ${{ vars.BOOTY_CYCLE_REGRESSION_AGENT_MIN_SECONDS || '2' }}

      - name: Upload KVM log (${{ matrix.scenario }})
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kvm-${{ matrix.scenario }}-log
          path: kvm-${{ matrix.scenario }}.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload cycle timing report
        if: always() && matrix.scenario == 'agent-cycle-timing'
        continue-on-error: true
