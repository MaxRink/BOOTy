name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

env:
  CONTAINERLAB_VERSION: "0.76.1"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run tests
        run: |
          set -o pipefail
          go test -v -race -timeout 20m -coverprofile=coverage.out ./... 2>&1 | tee test.log
          if grep -E '^[[:space:]]*--- SKIP:' test.log; then
            echo "::error::unit tests skipped in CI"
            exit 1
          fi

      - name: Check coverage gate (40%)
        run: |
          go tool cover -func=coverage.out | awk -v min="40.0" '
            BEGIN {
              threshold = min
              sub(/%$/, "", threshold)
              if (threshold !~ /^[0-9]+([.][0-9]+)?$/) {
                printf "::error::invalid coverage threshold: %s\n", min
                invalid = 1
                exit 2
              }
            }
            { print }
            /^total:/ {
              coverage = $3
              sub(/%$/, "", coverage)
              found = 1
            }
            END {
              if (invalid) {
                exit 2
              }
              if (!found) {
                print "::error::coverage check failed: total coverage line not found"
                exit 1
              }
              if (coverage + 0 < threshold + 0) {
                printf "::error::coverage %s%% is below %.1f%% minimum\n", coverage, threshold
                exit 1
              }
              printf "coverage %s%% meets %.1f%% minimum\n", coverage, threshold
            }'

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.out

  security:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run govulncheck
        run: python3 hack/check-govulncheck.py

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Run E2E tests
        run: |
          set -o pipefail
          # Run e2e tests excluding kvm/ (KVM tests run in the dedicated KVM matrix job)
          packages="$(go list -tags e2e ./test/e2e/...)"
          packages="$(printf '%s\n' "$packages" | awk '$0 !~ /\/kvm$/')"
          if [ -z "$packages" ]; then
            echo "no non-KVM e2e packages discovered" >&2
            exit 1
          fi
          printf '%s\n' "$packages" | xargs go test -tags e2e -v -race -count=1 -timeout 20m 2>&1 | tee e2e.log
          if grep -E '^[[:space:]]*--- SKIP:' e2e.log; then
            echo "::error::e2e tests skipped in CI"
            exit 1
          fi

  build:
    name: Build (${{ matrix.arch }})
    # `security` is deliberately not a dependency. The build, the E2E jobs and
    # the KVM jobs all chain off this job. A single vulnerability report used to
    # skip that whole chain, which hid unrelated regressions. The security job
    # still runs and still reports on every pull request.
    needs: [lint, test, e2e]
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Assert runner architecture
        run: |
          RUNNER_ARCH="$(uname -m)"
          case "${RUNNER_ARCH}" in
            x86_64)  EXPECTED="amd64" ;;
            aarch64) EXPECTED="arm64" ;;
            *)
              echo "::error::unsupported runner architecture: ${RUNNER_ARCH}"
              exit 1
              ;;
          esac
          if [ "${EXPECTED}" != "${{ matrix.arch }}" ]; then
            echo "::error::runner architecture ${EXPECTED} does not match matrix.arch ${{ matrix.arch }}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"
          cache: true

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 1
          CC: gcc
        run: go build -trimpath -ldflags "-s -w -linkmode external -extldflags '-static'" -o booty-${{ matrix.arch }}

      - name: Vet for darwin (build tags)
        if: matrix.arch == 'amd64'
        # Linux-only files, also test files, need //go:build linux; a missing
        # tag breaks local builds and tests on macOS.
        env:
          GOOS: darwin
          CGO_ENABLED: "0"
        run: go vet ./...

      - name: Upload binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: booty-${{ matrix.arch }}
          path: booty-${{ matrix.arch }}

  build-flavours:
    name: Build Flavours (amd64 slim + micro + gobgp)
    runs-on: ubuntu-latest
    needs: [lint]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build slim initramfs
        run: |
          docker buildx build --platform linux/amd64 --target slim \
            --output type=local,dest=out-slim -f initrd.Dockerfile .
          echo "Slim initramfs:"
          ls -lh out-slim/initramfs.cpio.zst

      - name: Build micro initramfs
        run: |
          docker buildx build --platform linux/amd64 --target micro \
            --output type=local,dest=out-micro -f initrd.Dockerfile .
          echo "Micro initramfs:"
          ls -lh out-micro/initramfs.cpio.gz

      - name: Build gobgp initramfs
        run: |
          docker buildx build --platform linux/amd64 --target gobgp \
            --output type=local,dest=out-gobgp -f initrd.Dockerfile .
          echo "GoBGP initramfs:"
          ls -lh out-gobgp/initramfs.cpio.zst

      - name: Verify size ordering
        run: |
          docker buildx build --platform linux/amd64 \
            --output type=local,dest=out-default -f initrd.Dockerfile .

          DEFAULT_SIZE=$(stat -c%s out-default/initramfs.cpio.zst)
          SLIM_SIZE=$(stat -c%s out-slim/initramfs.cpio.zst)
          MICRO_SIZE=$(stat -c%s out-micro/initramfs.cpio.gz)
          GOBGP_SIZE=$(stat -c%s out-gobgp/initramfs.cpio.zst)

          echo "Default: $(numfmt --to=iec $DEFAULT_SIZE)"
          echo "GoBGP:   $(numfmt --to=iec $GOBGP_SIZE)"
          echo "Slim:    $(numfmt --to=iec $SLIM_SIZE)"
          echo "Micro:   $(numfmt --to=iec $MICRO_SIZE)"

          if [ "$MICRO_SIZE" -ge "$SLIM_SIZE" ]; then
            echo "::error::Micro ($MICRO_SIZE) should be smaller than slim ($SLIM_SIZE)"
            exit 1
          fi
          if [ "$SLIM_SIZE" -ge "$GOBGP_SIZE" ]; then
            echo "::error::Slim ($SLIM_SIZE) should be smaller than gobgp ($GOBGP_SIZE)"
            exit 1
          fi
          if [ "$GOBGP_SIZE" -ge "$DEFAULT_SIZE" ]; then
            echo "::error::GoBGP ($GOBGP_SIZE) should be smaller than default ($DEFAULT_SIZE)"
            exit 1
          fi
          echo "PASS: micro < slim < gobgp < default"

      - name: Verify slim contents
        run: |
          zstd -dc out-slim/initramfs.cpio.zst | cpio -t 2>/dev/null > slim-files.txt
          echo "Slim file count: $(wc -l < slim-files.txt)"

          # Must contain BOOTy init and busybox
          grep -q "^init$\|^./init$" slim-files.txt || (echo "FAIL: init missing"; exit 1)
          grep -q "bin/busybox" slim-files.txt || (echo "FAIL: busybox missing"; exit 1)
          grep -q "bin/ip" slim-files.txt || (echo "FAIL: ip missing"; exit 1)
          grep -q "sbin/mdadm" slim-files.txt || (echo "FAIL: mdadm missing"; exit 1)
          grep -q "bin/efibootmgr" slim-files.txt || (echo "FAIL: efibootmgr missing"; exit 1)
          grep -q "bin/wipefs" slim-files.txt || (echo "FAIL: wipefs missing"; exit 1)
          grep -q "bin/sgdisk" slim-files.txt || (echo "FAIL: sgdisk missing"; exit 1)
          grep -q "bin/sfdisk" slim-files.txt || (echo "FAIL: sfdisk missing"; exit 1)
          grep -q "bin/growpart" slim-files.txt || (echo "FAIL: growpart missing"; exit 1)
          grep -q "bin/partx" slim-files.txt || (echo "FAIL: partx missing"; exit 1)
          grep -q "sbin/mkfs.ext4" slim-files.txt || (echo "FAIL: mkfs.ext4 missing"; exit 1)
          grep -q "sbin/mkfs.vfat" slim-files.txt || (echo "FAIL: mkfs.vfat missing"; exit 1)
          grep -q "sbin/mkfs.xfs" slim-files.txt || (echo "FAIL: mkfs.xfs missing"; exit 1)
          if grep -Eq '^(\./)?bin/mkfs\.vfat$' slim-files.txt; then echo "FAIL: busybox mkfs.vfat shadows dosfstools"; exit 1; fi
          if grep -Eq '^(\./)?bin/mkfs\.fat$' slim-files.txt; then echo "FAIL: busybox mkfs.fat shadows dosfstools"; exit 1; fi
          if grep -Eq '^(\./)?bin/mkdosfs$' slim-files.txt; then echo "FAIL: busybox mkdosfs shadows dosfstools"; exit 1; fi

          # Must NOT contain FRR or LVM
          if grep -q "sbin/bgpd" slim-files.txt; then echo "FAIL: bgpd present in slim"; exit 1; fi
          if grep -q "sbin/lvm" slim-files.txt; then echo "FAIL: lvm present in slim"; exit 1; fi
          echo "PASS: slim contents verified"

      - name: Verify micro contents
        run: |
          gzip -dc out-micro/initramfs.cpio.gz | cpio -t 2>/dev/null > micro-files.txt
          echo "Micro file count: $(wc -l < micro-files.txt)"

          # Must contain BOOTy init
          grep -q "^init$\|^./init$" micro-files.txt || (echo "FAIL: init missing"; exit 1)

          # Must NOT contain busybox, FRR, LVM, or external tools
          if grep -q "bin/busybox" micro-files.txt; then echo "FAIL: busybox present in micro"; exit 1; fi
          if grep -q "sbin/bgpd" micro-files.txt; then echo "FAIL: bgpd present in micro"; exit 1; fi
          if grep -q "bin/ip" micro-files.txt; then echo "FAIL: ip present in micro"; exit 1; fi
          echo "PASS: micro contents verified"

      - name: Verify gobgp contents
        run: |
          zstd -dc out-gobgp/initramfs.cpio.zst | cpio -t 2>/dev/null > gobgp-files.txt
          echo "GoBGP file count: $(wc -l < gobgp-files.txt)"

          # Must contain BOOTy init, busybox, networking, and disk tools
          grep -q "^init$\|^./init$" gobgp-files.txt || (echo "FAIL: init missing"; exit 1)
          grep -q "bin/busybox" gobgp-files.txt || (echo "FAIL: busybox missing"; exit 1)
          grep -q "bin/ip" gobgp-files.txt || (echo "FAIL: ip missing"; exit 1)
          grep -q "sbin/lvm" gobgp-files.txt || (echo "FAIL: lvm missing"; exit 1)
          grep -q "sbin/pvcreate" gobgp-files.txt || (echo "FAIL: pvcreate missing"; exit 1)
          grep -q "sbin/vgs" gobgp-files.txt || (echo "FAIL: vgs missing"; exit 1)
          grep -q "sbin/vgcreate" gobgp-files.txt || (echo "FAIL: vgcreate missing"; exit 1)
          grep -q "sbin/lvcreate" gobgp-files.txt || (echo "FAIL: lvcreate missing"; exit 1)

          # Must NOT contain FRR (GoBGP is in-process Go)
          if grep -q "sbin/bgpd" gobgp-files.txt; then echo "FAIL: bgpd present in gobgp"; exit 1; fi
          if grep -q "sbin/zebra" gobgp-files.txt; then echo "FAIL: zebra present in gobgp"; exit 1; fi
          if grep -q "bin/vtysh" gobgp-files.txt; then echo "FAIL: vtysh present in gobgp"; exit 1; fi
          echo "PASS: gobgp contents verified"

      - name: Verify kernel modules and applet links
        run: |
          # The Debian kernel builds storage controllers, software RAID and
          # efivarfs as modules. Without them only virtio disks are visible,
          # mdadm --create fails and efibootmgr has no EFI variables.
          for flavor in default gobgp slim; do
            zstd -dc "out-${flavor}/initramfs.cpio.zst" | cpio -t 2>/dev/null > "${flavor}-modules.txt"
            for ko in nvme nvme-core ahci libahci libata megaraid_sas mpt3sas scsi_transport_sas raid_class smartpqi hpsa md-mod raid1 raid10 raid456 efivarfs loop 8021q; do
              grep -Eq "^(\./)?modules/${ko}\.ko$" "${flavor}-modules.txt" || { echo "FAIL: ${flavor} has no modules/${ko}.ko"; exit 1; }
            done
            if grep -Eq '^(\./)?modules/bonding\.ko' "${flavor}-modules.txt"; then echo "FAIL: ${flavor} ships bonding.ko, loading it creates bond0"; exit 1; fi
            # Applet links must resolve inside the ramdisk, not to the build directory.
            # Device nodes need root to create; the links do not.
            mkdir -p "x-${flavor}" && (cd "x-${flavor}" && zstd -dc "../out-${flavor}/initramfs.cpio.zst" | cpio -id -f 'dev/*')
            if find "x-${flavor}" -type l -lname '/build/*' | grep .; then echo "FAIL: ${flavor} has links into the build directory"; exit 1; fi
            # Relative links must resolve inside the extracted ramdisk.
            if (cd "x-${flavor}" && find bin sbin -xtype l | grep .); then echo "FAIL: ${flavor} has dangling links"; exit 1; fi
          done
          echo "PASS: storage, RAID and efivarfs modules and relative applet links in default, gobgp and slim"

      - name: Upload build flavour artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-flavours
          path: |
            out-slim/initramfs.cpio.zst
            out-micro/initramfs.cpio.gz
            out-gobgp/initramfs.cpio.zst
            slim-files.txt
            micro-files.txt
            gobgp-files.txt
          if-no-files-found: ignore
          retention-days: 7

  detect-initramfs-flavor-changes:
    name: Detect Initramfs Flavor Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-build: ${{ steps.changed.outputs.should-build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changed
        name: Check initramfs flavor inputs
        run: |
          set -euo pipefail
          case "${{ github.event_name }}" in
            pull_request)
              git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}" > changed-files.txt
              ;;
            push)
              if [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
                git ls-tree -r --name-only HEAD > changed-files.txt
              else
                git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" > changed-files.txt
              fi
              ;;
            workflow_dispatch)
              printf '__manual__\n' > changed-files.txt
              ;;
            *)
              printf '__unknown_event__\n' > changed-files.txt
              ;;
          esac

          if grep -Eq '^(initrd\.Dockerfile|Makefile|go\.(mod|sum)|hack/|test/e2e/assets/busybox/|test/e2e/clab/booty.*Dockerfile|\.github/workflows/(ci|nightly|release-v2|pr-artifacts)\.yml|__manual__|__unknown_event__)' changed-files.txt; then
            echo "should-build=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-build=false" >> "$GITHUB_OUTPUT"
          fi

  build-flavors-arm64:
    name: Build Flavors (arm64 ${{ matrix.flavor }}, path-filtered)
    runs-on: ubuntu-24.04-arm
    needs: [lint, detect-initramfs-flavor-changes]
    if: needs.detect-initramfs-flavor-changes.outputs.should-build == 'true'
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: default
            target: ""
            artifact: initramfs.cpio.zst
          - flavor: gobgp
            target: "--target gobgp"
            artifact: initramfs.cpio.zst
          - flavor: slim
            target: "--target slim"
            artifact: initramfs.cpio.zst
          - flavor: micro
            target: "--target micro"
            artifact: initramfs.cpio.gz
    steps:
      - name: Assert runner architecture
        run: |
          if [ "$(uname -m)" != "aarch64" ]; then
            echo "::error::arm64 flavor coverage must run on an aarch64 runner"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4.4.0

      - name: Build initramfs (${{ matrix.flavor }}/arm64)
        run: |
          set -euo pipefail
          BUILD_FLAVOR="${{ matrix.flavor }}"
          if [ "${BUILD_FLAVOR}" = "default" ]; then
            BUILD_FLAVOR="full"
          fi
          docker buildx build --platform linux/arm64 \
            ${{ matrix.target }} \
            --build-arg "BOOTY_VERSION=ci" \
            --build-arg "BOOTY_BUILD=${{ github.sha }}" \
            --build-arg "BOOTY_FLAVOR=${BUILD_FLAVOR}" \
            --output type=local,dest=out-${{ matrix.flavor }}-arm64 \
            -f initrd.Dockerfile .
          test -f "out-${{ matrix.flavor }}-arm64/${{ matrix.artifact }}"
          ls -lh "out-${{ matrix.flavor }}-arm64/${{ matrix.artifact }}"

      - name: Upload arm64 flavor artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-flavor-${{ matrix.flavor }}-arm64
          path: out-${{ matrix.flavor }}-arm64/${{ matrix.artifact }}
          if-no-files-found: ignore
          retention-days: 7

  kvm-boot:
    name: KVM Boot Validation
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install QEMU and dependencies
        run: |
          # GitHub runner images can carry Microsoft/Azure apt sources that intermittently return 403.
          # Remove only those optional source snippets so unrelated package installs stay reliable.
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -delete
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 cpio zstd busybox-static

      - name: Build initramfs image
        run: |
          set -euo pipefail
          # Build BOOTy as a static binary for linux/amd64
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-linkmode external -extldflags '-static' -s -w" -o booty

          # Create initramfs directory structure
          mkdir -p initramfs/{bin,sbin,dev,proc,run,sys,etc,tmp,usr/bin,lib/modules,mnt,home}

          # Create device nodes so the kernel can give init a working console
          sudo mknod initramfs/dev/console c 5 1
          sudo mknod initramfs/dev/ttyS0 c 4 64
          sudo mknod initramfs/dev/null c 1 3

          # Prefer the Dependabot-tracked Docker image, with busybox-static as a CI network fallback.
          bash test/e2e/assets/busybox/extract.sh initramfs/bin/busybox
          # Verify that busybox is statically linked to avoid non-bootable initramfs output.
          if ! file initramfs/bin/busybox | grep -Eqi 'statically linked|static-pie linked'; then
            echo "ERROR: extracted /bin/busybox is not statically linked"
            file initramfs/bin/busybox || true
            exit 1
          fi
          cd initramfs/bin
          for cmd in sh mount umount insmod setsid cttyhack chroot; do
            ln -sf busybox "$cmd"
          done
          cd ../..
          cd initramfs/usr/bin && ln -sf ../../bin/busybox setsid && cd ../../..

          # Copy BOOTy binary
          cp booty initramfs/booty

          # Copy e1000 kernel module (QEMU default virtual NIC)
          MOD_PATH=$(find /lib/modules/$(uname -r) -name "e1000.ko*" -print -quit)
          if [ -n "$MOD_PATH" ]; then
            case "$MOD_PATH" in
              *.zst) zstd -d "$MOD_PATH" -o initramfs/lib/modules/e1000.ko ;;
              *.xz)  xz -dc "$MOD_PATH" > initramfs/lib/modules/e1000.ko ;;
              *.gz)  gzip -dc "$MOD_PATH" > initramfs/lib/modules/e1000.ko ;;
              *)     cp "$MOD_PATH" initramfs/lib/modules/e1000.ko ;;
            esac
            echo "Copied e1000 module from $MOD_PATH"
          else
            echo "WARNING: e1000 module not found"
          fi

          # Create init wrapper: loads NIC driver before starting BOOTy
          cat > initramfs/init << 'INITEOF'
          #!/bin/sh
          /bin/insmod /lib/modules/e1000.ko 2>/dev/null || true
          exec /booty
          INITEOF
          chmod +x initramfs/init

          # Add minimal /deploy/vars for CAPRF mode (dry-run)
          mkdir -p initramfs/deploy
          cat > initramfs/deploy/vars << 'VARSEOF'
          export MODE="dry-run"
          export DRY_RUN="true"
          export HOSTNAME="kvm-boot-test"
          VARSEOF

          # Package initramfs
          cd initramfs
          sudo find . -print0 | sudo cpio --null -ov --format=newc 2>/dev/null | gzip > ../test-initramfs.cpio.gz
          cd ..

      - name: Prepare kernel
        run: |
          sudo cp /boot/vmlinuz-$(uname -r) vmlinuz
          sudo chmod 644 vmlinuz

      - name: Boot with QEMU and validate
        timeout-minutes: 5
        run: |
          timeout 120 qemu-system-x86_64 \
            -kernel vmlinuz \
            -initrd test-initramfs.cpio.gz \
            -append "console=ttyS0 panic=1" \
            -m 512 \
            -display none \
            -monitor none \
            -no-reboot \
            -net nic,macaddr=52:54:00:12:34:56,model=e1000 \
            -net user \
            -serial file:serial.log \
            2>&1 || true

          python3 -c 'import os; assert os.get_blocking(1), "QEMU left runner stdout nonblocking"'

          echo ""
          echo "======================================="
          echo "        Serial Console Output          "
          echo "======================================="
          cat serial.log || true
          echo ""
          echo "======================================="

          PASS=true

          if grep -q "starting BOOTy\|Starting BOOTy" serial.log 2>/dev/null; then
            echo "PASS: BOOTy main flow reached"
          else
            echo "FAIL: BOOTy did not reach main flow"
            PASS=false
          fi

          if grep -q "CAPRF mode active" serial.log 2>/dev/null; then
            echo "PASS: CAPRF mode initialized successfully"
          else
            echo "FAIL: CAPRF mode did not initialize"
            PASS=false
          fi

          if grep -q "dry-run" serial.log 2>/dev/null; then
            echo "PASS: Dry-run mode detected"
          else
            echo "FAIL: Dry-run mode not detected"
            PASS=false
          fi

          # Check for unexpected ERROR-level log entries.
          # Allow-list: errors expected in minimal CI environments (no disk, no provisioning server response).
          ALLOWED_ERRORS="no suitable disk found|detect-disk|partition-disk|parse-partitions|format-disk|stream-image|[Pp]rovisioning failed|[Pp]rovisioning step|[Dd]eprovisioning failed|[Dd]eprovisioning step|Connecting to provisioning server|DEBUG DUMP|=== DEBUG|=== CONFIG|Disk Error|msg=DEBUG|debug dump|Debug command|DEBUG env|CAPRF client|dry-run failed|mode exited with error"
          UNEXPECTED=$(grep 'level=ERROR' serial.log 2>/dev/null | grep -vE "$ALLOWED_ERRORS" || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "FAIL: Unexpected ERROR-level log entries found:"
            echo "$UNEXPECTED"
            PASS=false
          else
            echo "PASS: No unexpected ERROR-level log entries"
          fi

          if [ "$PASS" = "false" ]; then
            echo ""
            echo "E2E BOOT VALIDATION FAILED"
            exit 1
          fi

          echo ""
          echo "ALL E2E CHECKS PASSED"

      - name: Upload serial log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kvm-boot-serial-log
          path: serial.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          [ -f server.pid ] && kill $(cat server.pid) 2>/dev/null || true

  e2e-clab:
    name: E2E ContainerLab
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Generate test disk image
        run: sudo test/e2e/clab/create-test-image.sh test/e2e/clab/images

      - name: Install ContainerLab
        run: test/e2e/clab/install-containerlab.sh "${CONTAINERLAB_VERSION}"

      - name: Deploy topology
        run: sudo containerlab deploy --topo test/e2e/clab/topology.clab.yml

      - name: Wait for BGP convergence
        run: |
          echo "Waiting for BGP sessions to establish..."
          for i in $(seq 1 90); do
            # An established BGP neighbor shows an uptime (e.g. 00:00:27) in the Up/Down column.
            # Non-established neighbors show a state name like Active, Idle, Connect, etc.
            if sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp summary" 2>/dev/null | grep -qE "leaf01.*[0-9]{2}:[0-9]{2}:[0-9]{2}"; then
              echo "BGP sessions established after ${i}s"
              sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp summary"
              break
            fi
            sleep 1
          done
          if ! sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp summary" 2>/dev/null | grep -qE "leaf01.*[0-9]{2}:[0-9]{2}:[0-9]{2}"; then
            echo "BGP sessions did not establish in 90s"
            sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp summary" || true
            exit 1
          fi
          echo "Polling for EVPN routes on leaf01 (up to 30s)..."
          for i in $(seq 1 30); do
            if sudo docker exec clab-booty-lab-leaf01 ip -d link show type vxlan 2>/dev/null | grep -q "vxlan"; then
              echo "EVPN data-plane ready after ${i}s"
              break
            fi
            sleep 1
          done

          # Check for EVPN routes on the control plane (FRR) instead of sleeping unconditionally.
          echo "Waiting for EVPN routes to appear on spine01 (up to 60s)..."
          for j in $(seq 1 60); do
            if sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null | grep -qE "\[[0-9]+\]:\[[0-9]+\]"; then
              echo "EVPN routes detected after ${j}s"
              sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp l2vpn evpn"
              break
            fi
            sleep 1
          done
          if ! sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null | grep -qE "\[[0-9]+\]:\[[0-9]+\]"; then
            echo "EVPN routes did not appear in 60s after BGP convergence"
            sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp summary" || true
            sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp l2vpn evpn" || true
            exit 1
          fi

      - name: Run E2E integration tests
        env:
          BOOTY_TOPOLOGY: lab
          # -parallel limits t.Parallel() subtests (not used in e2e_integration); GOMAXPROCS caps
          # OS threads to reduce runner contention.
          GOMAXPROCS: "2"
        run: |
          set -o pipefail
          go test -tags e2e_integration -v -race -count=1 -timeout 10m ./test/e2e/integration/... 2>&1 | tee e2e-integration.log
          if grep -E '^[[:space:]]*--- SKIP:' e2e-integration.log; then
            echo "::error::containerlab e2e tests skipped in CI"
            exit 1
          fi

      - name: Collect container logs
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p clab-logs
          for c in spine01 leaf01 client nginx caprf-mock; do
            name="clab-booty-lab-${c}"
            echo "=== Logs for ${name} ===" | tee clab-logs/${c}.log
            timeout 30 sudo docker logs "${name}" >> clab-logs/${c}.log 2>&1 || echo "(no logs)"
          done

          echo ""
          echo "=== FRR Routing State (spine01) ==="
          timeout 15 sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp summary json" 2>/dev/null | tee clab-logs/spine01-bgp-summary.txt || true
          timeout 15 sudo docker exec clab-booty-lab-spine01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null | tee clab-logs/spine01-evpn.txt || true
          timeout 15 sudo docker exec clab-booty-lab-spine01 vtysh -c "show ip route" 2>/dev/null | tee clab-logs/spine01-routes.txt || true

          echo ""
          echo "=== FRR Routing State (leaf01) ==="
          timeout 15 sudo docker exec clab-booty-lab-leaf01 vtysh -c "show bgp summary json" 2>/dev/null | tee clab-logs/leaf01-bgp-summary.txt || true
          timeout 15 sudo docker exec clab-booty-lab-leaf01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null | tee clab-logs/leaf01-evpn.txt || true
          timeout 15 sudo docker exec clab-booty-lab-leaf01 vtysh -c "show ip route" 2>/dev/null | tee clab-logs/leaf01-routes.txt || true

          echo ""
          echo "=== EVPN Data Plane State ==="
          for c in spine01 leaf01; do
            name="clab-booty-lab-${c}"
            timeout 5 sudo docker exec "${name}" bridge fdb show 2>/dev/null | tee clab-logs/${c}-fdb.txt || true
            timeout 5 sudo docker exec "${name}" ip -d link show type vxlan 2>/dev/null | tee clab-logs/${c}-vxlan.txt || true
            timeout 5 sudo docker exec "${name}" ip neigh show 2>/dev/null | tee clab-logs/${c}-neigh.txt || true
          done

      - name: Upload ContainerLab logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: clab-logs
          path: clab-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if command -v containerlab >/dev/null 2>&1; then
            sudo containerlab destroy --topo test/e2e/clab/topology.clab.yml --cleanup || true
          fi

  e2e-production:
    name: E2E Production Smoke (ContainerLab)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Build BOOTy test container image
        run: test/e2e/clab/docker-build-retry.sh -t booty-test:latest -f test/e2e/clab/booty-test.Dockerfile .

      - name: Generate test disk image
        run: sudo test/e2e/clab/create-test-image.sh test/e2e/clab/images

      - name: Install ContainerLab
        run: test/e2e/clab/install-containerlab.sh "${CONTAINERLAB_VERSION}"

      - name: Deploy production topology
        run: sudo containerlab deploy --topo test/e2e/clab/topology-production.clab.yml

      - name: Run production E2E tests
        env:
          GOMAXPROCS: "2"
        run: |
          set -euo pipefail
          make test-e2e-production 2>&1 | tee production-e2e.log
          if ! grep -q '^=== RUN   TestProduction' production-e2e.log; then
            echo "::error::production E2E job did not run any TestProduction tests"
            exit 1
          fi
          for expected in \
            TestProductionBootyStartsSuccessfully \
            TestProductionCAPRFModeDetected \
            TestProductionFRRNetworkModeSelected \
            TestProductionSpineBGPEstablished \
            TestProductionDCGWBGPEstablished \
            TestProductionSpineDCGWBGPEstablished \
            TestProductionEVPNAddressFamilyOnSpine \
            TestProductionEVPNAddressFamilyOnDCGW \
            TestProductionVXLANInterfaceCreated \
            TestProductionProvisionBridgeIP \
            TestProductionUnderlayRouteOnSpine \
            TestProductionUnderlayRouteOnDCGW \
            TestProductionOverlayReachClient \
            TestProductionOverlayReachNginx \
            TestProductionOverlayReachCAPRF \
            TestProductionGatewayFDB \
            TestProductionGatewayRoute; do
            if ! grep -q "^=== RUN   ${expected}$" production-e2e.log; then
              echo "::error::production E2E job did not run ${expected}"
              exit 1
            fi
          done
          if grep -q '^--- SKIP:' production-e2e.log; then
            echo "::error::production E2E tests must not skip in CI"
            grep '^--- SKIP:' production-e2e.log
            exit 1
          fi

      - name: Collect production logs
        if: always()
        timeout-minutes: 8
        run: |
          mkdir -p production-logs

          for node in spine01 dcgw01 booty-prod client nginx caprf-mock; do
            name="clab-booty-production-lab-${node}"
            timeout 30 sudo docker logs "${name}" > "production-logs/${node}.log" 2>&1 || echo "(no logs)" >> "production-logs/${node}.log"
          done

          timeout 15 sudo docker exec clab-booty-production-lab-caprf-mock \
            cat /var/log/nginx/access.log 2>/dev/null | tee production-logs/caprf-access.log || true

          for node in spine01 dcgw01; do
            name="clab-booty-production-lab-${node}"
            for cmd in \
              "show bgp summary json" \
              "show bgp l2vpn evpn" \
              "show bgp l2vpn evpn json" \
              "show ip route" \
              "show bfd peers"; do
              slug=$(echo "$cmd" | tr ' ' '-')
              timeout 15 sudo docker exec "${name}" \
                vtysh -c "$cmd" 2>/dev/null | tee "production-logs/${node}-${slug}.txt" || true
            done
          done

          for node in spine01 dcgw01 booty-prod client nginx caprf-mock; do
            name="clab-booty-production-lab-${node}"
            {
              echo "=== ip addr show ==="
              timeout 5 sudo docker exec "${name}" ip addr show 2>&1 || true
              echo "=== ip route show table all ==="
              timeout 5 sudo docker exec "${name}" ip route show table all 2>&1 || true
              echo "=== ip -d link show type vxlan ==="
              timeout 5 sudo docker exec "${name}" ip -d link show type vxlan 2>&1 || true
              echo "=== bridge fdb show ==="
              timeout 5 sudo docker exec "${name}" bridge fdb show 2>&1 || true
            } > "production-logs/${node}-network.txt" 2>&1
          done

      - name: Upload production logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-e2e-logs
          path: |
            production-e2e.log
            production-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if command -v containerlab >/dev/null 2>&1; then
            sudo containerlab destroy --topo test/e2e/clab/topology-production.clab.yml --cleanup || true
          fi

  uefi-iso-boot:
    name: UEFI ISO Boot Validation
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install UEFI and ISO dependencies
        run: |
          # GitHub runner images can carry Microsoft/Azure apt sources that intermittently return 403.
          # Remove only those optional source snippets so unrelated package installs stay reliable.
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -delete
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf xorriso grub-efi-amd64-bin \
            grub-common mtools cpio zstd busybox-static dosfstools \
            isolinux syslinux-common swtpm swtpm-tools

      - name: Build initramfs image
        run: |
          set -euo pipefail
          # Build BOOTy as a static binary for linux/amd64
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 \
            go build -trimpath -ldflags "-linkmode external -extldflags '-static' -s -w" -o booty

          # Create initramfs directory structure
          mkdir -p initramfs/{bin,sbin,dev,proc,run,sys,etc,tmp,usr/bin,lib/modules,mnt,home}

          # Create device nodes so the kernel can give init a working console
          sudo mknod initramfs/dev/console c 5 1
          sudo mknod initramfs/dev/ttyS0 c 4 64
          sudo mknod initramfs/dev/null c 1 3

          # Prefer the Dependabot-tracked Docker image, with busybox-static as a CI network fallback.
          bash test/e2e/assets/busybox/extract.sh initramfs/bin/busybox
          # Verify that busybox is statically linked to avoid non-bootable initramfs output.
          if ! file initramfs/bin/busybox | grep -Eqi 'statically linked|static-pie linked'; then
            echo "ERROR: extracted /bin/busybox is not statically linked"
            file initramfs/bin/busybox || true
            exit 1
          fi
          cd initramfs/bin
          for cmd in sh mount umount insmod setsid cttyhack chroot; do
            ln -sf busybox "$cmd"
          done
          cd ../..
          cd initramfs/usr/bin && ln -sf ../../bin/busybox setsid && cd ../../..

          # Copy BOOTy binary
          cp booty initramfs/booty

          # Copy e1000 kernel module (QEMU default virtual NIC)
          MOD_PATH=$(find /lib/modules/$(uname -r) -name "e1000.ko*" -print -quit)
          if [ -n "$MOD_PATH" ]; then
            case "$MOD_PATH" in
              *.zst) zstd -d "$MOD_PATH" -o initramfs/lib/modules/e1000.ko ;;
              *.xz)  xz -dc "$MOD_PATH" > initramfs/lib/modules/e1000.ko ;;
              *.gz)  gzip -dc "$MOD_PATH" > initramfs/lib/modules/e1000.ko ;;
              *)     cp "$MOD_PATH" initramfs/lib/modules/e1000.ko ;;
            esac
          fi

          # Create init wrapper
          cat > initramfs/init << 'INITEOF'
          #!/bin/sh
          /bin/insmod /lib/modules/e1000.ko 2>/dev/null || true
          exec /booty
          INITEOF
          chmod +x initramfs/init

          # Add minimal /deploy/vars for CAPRF mode (dry-run)
          mkdir -p initramfs/deploy
          cat > initramfs/deploy/vars << 'VARSEOF'
          export MODE="dry-run"
          export DRY_RUN="true"
          export HOSTNAME="uefi-boot-test"
          VARSEOF

          # Package initramfs
          cd initramfs
          sudo find . -print0 | sudo cpio --null -ov --format=newc 2>/dev/null | gzip > ../test-initramfs.cpio.gz
          cd ..

      - name: Prepare kernel
        run: |
          sudo cp /boot/vmlinuz-$(uname -r) vmlinuz
          sudo chmod 644 vmlinuz

      - name: Create UEFI-bootable ISO
        run: |
          # Create ISO directory structure
          mkdir -p iso/boot/grub iso/EFI/BOOT
          cp vmlinuz iso/boot/vmlinuz
          cp test-initramfs.cpio.gz iso/boot/initrd

          # Write GRUB configuration
          cat > iso/boot/grub/grub.cfg << 'EOF'
          search --no-floppy --set=root --file /boot/vmlinuz
          set timeout=0
          set default=0
          menuentry 'BOOTy UEFI Test' {
            linux /boot/vmlinuz console=ttyS0 panic=1
            initrd /boot/initrd
          }
          EOF

          # Create standalone GRUB EFI binary
          grub-mkstandalone -O x86_64-efi -o iso/EFI/BOOT/BOOTX64.EFI \
            --locales="" --fonts="" \
            "boot/grub/grub.cfg=iso/boot/grub/grub.cfg"

          # Create FAT image for EFI System Partition
          dd if=/dev/zero of=iso/efi.img bs=1M count=8
          mkfs.vfat iso/efi.img
          mmd -i iso/efi.img ::/EFI ::/EFI/BOOT
          mcopy -i iso/efi.img iso/EFI/BOOT/BOOTX64.EFI ::/EFI/BOOT/

          # Create UEFI-bootable ISO
          xorriso -as mkisofs \
            -R -J \
            -o test-uefi.iso \
            -eltorito-alt-boot \
            -e efi.img \
            -no-emul-boot \
            iso/

          ls -lh test-uefi.iso
          echo "UEFI ISO created successfully"

      - name: Boot ISO with UEFI firmware (OVMF) and validate
        timeout-minutes: 5
        run: |
          # Find OVMF firmware — prefer non-secboot 4M variant for reliable unsigned GRUB boot.
          # The secboot variant rejects unsigned EFI binaries, causing silent boot failure.
          OVMF_CODE=$(find /usr/share -name "OVMF_CODE_4M.fd" 2>/dev/null | head -1)
          if [ -z "$OVMF_CODE" ]; then
            OVMF_CODE=$(find /usr/share -name "OVMF_CODE.fd" 2>/dev/null | head -1)
          fi
          OVMF_VARS=$(find /usr/share -name "OVMF_VARS_4M.fd" 2>/dev/null | head -1)
          if [ -z "$OVMF_VARS" ]; then
            OVMF_VARS=$(find /usr/share -name "OVMF_VARS.fd" 2>/dev/null | head -1)
          fi
          if [ -z "$OVMF_CODE" ] || [ -z "$OVMF_VARS" ]; then
            echo "OVMF firmware not found"
            exit 1
          fi
          echo "Using OVMF code: $OVMF_CODE"
          echo "Using OVMF vars: $OVMF_VARS"
          cp "$OVMF_VARS" /tmp/ovmf_vars.fd

          timeout 120 qemu-system-x86_64 \
            -drive if=pflash,format=raw,readonly=on,file="$OVMF_CODE" \
            -drive if=pflash,format=raw,file=/tmp/ovmf_vars.fd \
            -cdrom test-uefi.iso \
            -boot d \
            -m 512 \
            -display none \
            -monitor none \
            -no-reboot \
            -net nic,macaddr=52:54:00:12:34:56,model=e1000 \
            -net user \
            -serial file:serial-uefi.log \
            2>&1 || true

          python3 -c 'import os; assert os.get_blocking(1), "QEMU left runner stdout nonblocking"'

          echo ""
          echo "========================================="
          echo "     UEFI ISO Serial Console Output      "
          echo "========================================="
          cat serial-uefi.log || true
          echo ""
          echo "========================================="

          PASS=true

          # Primary check: BOOTy binary started (proves UEFI firmware → GRUB → kernel → initramfs → BOOTy)
          if grep -q "starting BOOTy\|Starting BOOTy" serial-uefi.log 2>/dev/null; then
            echo "PASS: BOOTy started under UEFI — full EFI boot chain working"
          else
            echo "FAIL: BOOTy did not start under UEFI"
            PASS=false
          fi

          # Secondary check: provisioning flow reached
          if grep -q "beginning provisioning process\|Beginning provisioning process" serial-uefi.log 2>/dev/null; then
            echo "PASS: BOOTy provisioning flow reached under UEFI"
          else
            echo "FAIL: BOOTy provisioning flow not reached under UEFI"
            PASS=false
          fi

          # Network checks are best-effort under UEFI — serial buffer flushing
          # with OVMF can be incomplete compared to direct kernel boot.
          if grep -q "CAPRF mode active" serial-uefi.log 2>/dev/null; then
            echo "PASS: CAPRF mode initialized under UEFI"
          else
            echo "INFO: CAPRF mode not detected in serial output (may be UEFI serial buffering)"
          fi

          if [ "$PASS" = "false" ]; then
            echo ""
            echo "UEFI ISO BOOT VALIDATION FAILED"
            exit 1
          fi

          echo ""
          echo "ALL UEFI ISO BOOT CHECKS PASSED"

      - name: Upload UEFI serial log
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: uefi-iso-boot-serial-log
          path: serial-uefi.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload ISO artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: booty-uefi-iso
          path: test-uefi.iso
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          [ -f server.pid ] && kill $(cat server.pid) 2>/dev/null || true

  linux-e2e:
    name: Linux E2E (Privileged)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Install disk utilities
        run: |
          # GitHub runner images can carry Microsoft/Azure apt sources that intermittently return 403.
          # Remove only those optional source snippets so unrelated package installs stay reliable.
          sudo find /etc/apt/sources.list.d -type f \( -iname '*microsoft*' -o -iname '*azure-cli*' \) -delete
          sudo apt-get update
          sudo apt-get install -y fdisk gdisk e2fsprogs xfsprogs btrfs-progs cloud-guest-utils parted util-linux qemu-utils mdadm lvm2 zstd lz4 xz-utils

      - name: Run Linux E2E tests
        shell: bash
        run: |
          set -eo pipefail
          mkdir -p linux-e2e-logs
          sudo -E env "PATH=$PATH:/usr/sbin:/sbin" "$(which go)" test -tags linux_e2e -v -count=1 -timeout 5m ./test/e2e/linux/... 2>&1 | tee linux-e2e-logs/go-test.log
          # TestFIBWriterKernel creates a VRF in a network namespace; the
          # Azure runner kernel has the module in linux-modules-extra.
          if ! sudo modprobe vrf; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe vrf
          fi
          sudo -E env "PATH=$PATH:/usr/sbin:/sbin" "$(which go)" test -tags linux_e2e -v -count=1 -timeout 5m -run '^TestType5Netlink|^TestFIBWriterKernel|^TestL3VNINetlink' ./pkg/network/gobgp/ 2>&1 | tee -a linux-e2e-logs/go-test.log
          sudo -E env "PATH=$PATH:/usr/sbin:/sbin" "$(which go)" test -tags linux_e2e -v -count=1 -timeout 5m -run '^TestDHCPNetlink' ./pkg/network/ 2>&1 | tee -a linux-e2e-logs/go-test.log
          if grep -E '^[[:space:]]*--- SKIP:' linux-e2e-logs/go-test.log; then
            echo "::error::linux e2e tests skipped in CI"
            exit 1
          fi

      - name: Collect Linux E2E diagnostics
        if: always()
        run: |
          mkdir -p linux-e2e-logs
          {
            echo "## uname"
            uname -a
            echo
            echo "## disk usage"
            df -h
            echo
            echo "## block devices"
            lsblk -o NAME,MAJ:MIN,SIZE,TYPE,FSTYPE,MOUNTPOINTS || true
            echo
            echo "## loop devices"
            sudo losetup -a || true
            echo
            echo "## mounted filesystems"
            findmnt || true
            echo
            echo "## qemu-img"
            qemu-img --version || true
          } > linux-e2e-logs/host-diagnostics.txt 2>&1

      - name: Upload Linux E2E diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-e2e-diagnostics
          path: linux-e2e-logs/
          if-no-files-found: ignore
          retention-days: 7

  e2e-boot:
    name: E2E Boot (ContainerLab)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Build BOOTy test container image
        run: test/e2e/clab/docker-build-retry.sh -t booty-test:latest -f test/e2e/clab/booty-test.Dockerfile .

      - name: Generate test disk image
        run: sudo test/e2e/clab/create-test-image.sh test/e2e/clab/images

      - name: Install ContainerLab
        run: test/e2e/clab/install-containerlab.sh "${CONTAINERLAB_VERSION}"

      - name: Deploy boot topology
        run: sudo containerlab deploy --topo test/e2e/clab/topology-boot.clab.yml

      - name: Wait for BGP convergence
        run: |
          echo "Waiting for BGP sessions to establish..."
          for i in $(seq 1 180); do
            if sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp summary" 2>/dev/null | grep -qE "leaf01.*[0-9]{2}:[0-9]{2}:[0-9]{2}"; then
              echo "BGP sessions established after ${i}s"
              sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp summary"
              break
            fi
            sleep 1
          done
          if ! sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp summary" 2>/dev/null | grep -qE "leaf01.*[0-9]{2}:[0-9]{2}:[0-9]{2}"; then
            echo "BGP sessions did not establish in 180s"
            sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp summary" || true
            exit 1
          fi
          echo "Waiting for EVPN routes to appear after BGP convergence..."
          for i in $(seq 1 60); do
            if sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null | grep -qE "\[[0-9]+\]:\[[0-9]+\]"; then
              echo "EVPN routes detected after ${i}s"
              sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp l2vpn evpn"
              break
            fi
            sleep 1
          done
          if ! sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null | grep -qE "\[[0-9]+\]:\[[0-9]+\]"; then
            echo "EVPN routes did not appear in 60s after BGP convergence"
            sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp summary" || true
            sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp l2vpn evpn" || true
            exit 1
          fi

      - name: Run BOOTy boot E2E tests
        # -parallel=2 is a no-op without t.Parallel(); use GOMAXPROCS to cap OS threads.
        env:
          GOMAXPROCS: "2"
        run: |
          set -o pipefail
          go test -tags e2e_boot -v -race -count=1 -timeout 30m ./test/e2e/integration/... 2>&1 | tee e2e-boot.log
          if grep -E '^[[:space:]]*--- SKIP:' e2e-boot.log; then
            echo "::error::boot e2e tests skipped in CI"
            exit 1
          fi

      - name: Collect BOOTy container logs
        if: always()
        timeout-minutes: 8
        run: |
          mkdir -p boot-logs

          for node in booty-provision booty-deprovision booty-standby; do
            name="clab-booty-boot-lab-${node}"
            echo ""
            echo "======================================="
            echo "  ${node} FULL BOOTY LOGS"
            echo "======================================="
            timeout 30 sudo docker logs "${name}" 2>&1 | tee boot-logs/${node}.log || echo "(no logs)"
            echo "======================================="
          done

          echo ""
          echo "======================================="
          echo "  CAPRF Mock Access Log"
          echo "======================================="
          timeout 15 sudo docker exec clab-booty-boot-lab-caprf-mock cat /var/log/nginx/access.log 2>/dev/null | tee boot-logs/caprf-access.log || echo "(no logs)"
          echo "======================================="

          echo ""
          echo "======================================="
          echo "  BGP Summary (spine01)"
          echo "======================================="
          timeout 15 sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp summary" 2>/dev/null | tee boot-logs/bgp-summary.txt || true

          echo ""
          echo "======================================="
          echo "  EVPN State (spine01)"
          echo "======================================="
          timeout 15 sudo docker exec clab-booty-boot-lab-spine01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null | tee boot-logs/evpn-state.txt || true

      - name: Upload boot logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: boot-logs
          path: boot-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if command -v containerlab >/dev/null 2>&1; then
            sudo containerlab destroy --topo test/e2e/clab/topology-boot.clab.yml --cleanup || true
          fi

  e2e-gobgp:
    name: E2E GoBGP PeerModes
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Build GoBGP test image
        run: test/e2e/clab/docker-build-retry.sh -t booty-gobgp-test:latest -f test/e2e/clab/booty-gobgp-test.Dockerfile .

      - name: Install ContainerLab
        run: test/e2e/clab/install-containerlab.sh "${CONTAINERLAB_VERSION}"

      - name: Deploy GoBGP topology
        run: sudo containerlab deploy --topo test/e2e/clab/topology-gobgp.clab.yml

      - name: Wait for BGP convergence
        run: |
          echo "Waiting for GoBGP sessions to establish..."
          for i in $(seq 1 120); do
            ESTABLISHED=$(sudo docker exec clab-booty-gobgp-lab-spine01 vtysh -c "show bgp summary json" 2>/dev/null \
              | grep -c '"state":"Established"' || true)
            if [ "$ESTABLISHED" -ge 6 ]; then
              echo "All BGP sessions established after ${i}s"
              sudo docker exec clab-booty-gobgp-lab-spine01 vtysh -c "show bgp summary"
              break
            fi
            sleep 1
          done
          ESTABLISHED=$(sudo docker exec clab-booty-gobgp-lab-spine01 vtysh -c "show bgp summary json" 2>/dev/null \
            | grep -c '"state":"Established"' || true)
          if [ "$ESTABLISHED" -lt 6 ]; then
            echo "Not all BGP sessions established in 120s"
            sudo docker exec clab-booty-gobgp-lab-spine01 vtysh -c "show bgp summary" || true
            exit 1
          fi
          echo "Polling for EVPN routes on booty-unnumbered (up to 30s)..."
          for i in $(seq 1 30); do
            if sudo docker exec clab-booty-gobgp-lab-booty-unnumbered ip -d link show type vxlan 2>/dev/null | grep -q "vxlan"; then
              echo "EVPN data-plane ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run GoBGP E2E tests
        # -parallel limits t.Parallel() subtests (not used in e2e_gobgp); GOMAXPROCS caps
        # OS threads to reduce runner contention.
        env:
          GOMAXPROCS: "2"
        run: |
          set -o pipefail
          go test -tags e2e_gobgp -v -race -count=1 -timeout 10m ./test/e2e/integration/... 2>&1 | tee e2e-gobgp.log
          if grep -E '^[[:space:]]*--- SKIP:' e2e-gobgp.log; then
            echo "::error::gobgp e2e tests skipped in CI"
            exit 1
          fi

      - name: Collect GoBGP logs
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p gobgp-logs

          # Container logs (stdout/stderr from all nodes).
          for node in spine01 leaf01 rr01 booty-unnumbered booty-dual booty-numbered booty-l2 client; do
            name="clab-booty-gobgp-lab-${node}"
            timeout 30 sudo docker logs "${name}" >> gobgp-logs/${node}.log 2>&1 || echo "(no logs)"
          done

          # FRR BGP state on spine01 (JSON where possible for structured debugging).
          for cmd in \
            "show bgp summary json" \
            "show bgp l2vpn evpn" \
            "show bgp l2vpn evpn json" \
            "show ip route" \
            "show evpn vni"; do
            slug=$(echo "$cmd" | tr ' ' '-')
            timeout 15 sudo docker exec clab-booty-gobgp-lab-spine01 \
              vtysh -c "$cmd" 2>/dev/null | tee gobgp-logs/spine01-${slug}.txt || true
          done

          # FRR BGP state on rr01.
          for cmd in \
            "show bgp summary json" \
            "show bgp neighbors 10.0.1.1 json"; do
            slug=$(echo "$cmd" | tr ' ' '-')
            timeout 15 sudo docker exec clab-booty-gobgp-lab-rr01 \
              vtysh -c "$cmd" 2>/dev/null | tee gobgp-logs/rr01-${slug}.txt || true
          done

          # Network + EVPN data plane state from each container.
          for node in spine01 leaf01 booty-unnumbered booty-dual booty-numbered booty-l2; do
            name="clab-booty-gobgp-lab-${node}"
            {
              echo "=== ip -d link show type vxlan ==="
              timeout 5 sudo docker exec "${name}" ip -d link show type vxlan 2>&1 || true
              echo "=== ip addr show ==="
              timeout 5 sudo docker exec "${name}" ip addr show 2>&1 || true
              echo "=== ip -6 addr show ==="
              timeout 5 sudo docker exec "${name}" ip -6 addr show 2>&1 || true
              echo "=== ip -6 neigh show ==="
              timeout 5 sudo docker exec "${name}" ip -6 neigh show 2>&1 || true
              echo "=== ip neigh show ==="
              timeout 5 sudo docker exec "${name}" ip neigh show 2>&1 || true
              echo "=== ip route show ==="
              timeout 5 sudo docker exec "${name}" ip route show 2>&1 || true
              echo "=== ip -6 route show ==="
              timeout 5 sudo docker exec "${name}" ip -6 route show 2>&1 || true
              echo "=== bridge fdb show ==="
              timeout 5 sudo docker exec "${name}" bridge fdb show 2>&1 || true
            } > gobgp-logs/${node}-network.txt 2>&1
          done

      - name: Upload GoBGP logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gobgp-logs
          path: gobgp-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if command -v containerlab >/dev/null 2>&1; then
            sudo containerlab destroy --topo test/e2e/clab/topology-gobgp.clab.yml --cleanup || true
          fi

  e2e-type5:
    name: E2E Pure Type-5 Fabric
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Build GoBGP test image
        run: test/e2e/clab/docker-build-retry.sh -t booty-gobgp-test:latest -f test/e2e/clab/booty-gobgp-test.Dockerfile .

      - name: Install ContainerLab
        run: test/e2e/clab/install-containerlab.sh "${CONTAINERLAB_VERSION}"

      - name: Deploy Type-5 topology
        run: sudo containerlab deploy --topo test/e2e/clab/topology-type5.clab.yml

      - name: Wait for BGP convergence
        run: |
          echo "Waiting for Type-5 fabric BGP sessions to establish..."
          CONVERGED=false
          for i in $(seq 1 120); do
            # Check spine sessions (2 leaves).
            SPINE_UP=$(sudo docker exec clab-booty-type5-lab-spine01 \
              vtysh -c "show bgp summary json" 2>/dev/null \
              | grep -c '"state":"Established"' || true)
            # Check leaf-VM sessions.
            LEAF1_UP=$(sudo docker exec clab-booty-type5-lab-leaf01 \
              vtysh -c "show bgp summary json" 2>/dev/null \
              | grep -c '"state":"Established"' || true)
            LEAF2_UP=$(sudo docker exec clab-booty-type5-lab-leaf02 \
              vtysh -c "show bgp summary json" 2>/dev/null \
              | grep -c '"state":"Established"' || true)
            TOTAL=$((SPINE_UP + LEAF1_UP + LEAF2_UP))
            if [ "$TOTAL" -ge 6 ]; then
              echo "All BGP sessions established after ${i}s (spine=$SPINE_UP, leaf01=$LEAF1_UP, leaf02=$LEAF2_UP)"
              CONVERGED=true
              break
            fi
            sleep 1
          done
          if [ "$CONVERGED" = "false" ]; then
            echo "::error::BGP sessions did not converge in 120s (spine=$SPINE_UP, leaf01=$LEAF1_UP, leaf02=$LEAF2_UP)"
            sudo docker exec clab-booty-type5-lab-spine01 vtysh -c "show bgp summary" || true
            sudo docker exec clab-booty-type5-lab-leaf01 vtysh -c "show bgp summary" || true
            sudo docker exec clab-booty-type5-lab-leaf02 vtysh -c "show bgp summary" || true
            sudo docker logs clab-booty-type5-lab-booty-vm0 2>&1 | tail -50 || true
            exit 1
          fi
          echo "Polling for VXLAN VNI 1000 on booty-vm0 (up to 60s)..."
          for i in $(seq 1 60); do
            if sudo docker exec clab-booty-type5-lab-booty-vm0 ip -d link show type vxlan 2>/dev/null | grep -q "id 1000"; then
              echo "EVPN data-plane ready (VNI 1000) after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run Type-5 E2E tests
        env:
          GOMAXPROCS: "2"
        run: |
          set -o pipefail
          go test -tags e2e_gobgp_type5 -v -race -count=1 -timeout 10m ./test/e2e/integration/... 2>&1 | tee e2e-type5.log
          if grep -E '^[[:space:]]*--- SKIP:' e2e-type5.log; then
            echo "::error::type-5 e2e tests skipped in CI"
            exit 1
          fi

      - name: Collect Type-5 logs
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p type5-logs

          for node in spine01 leaf01 leaf02 booty-vm0 booty-vm1; do
            name="clab-booty-type5-lab-${node}"
            timeout 30 sudo docker logs "${name}" >> type5-logs/${node}.log 2>&1 || echo "(no logs)"
          done

          # FRR state on spine01.
          for cmd in \
            "show bgp summary json" \
            "show bgp ipv4 unicast" \
            "show bgp l2vpn evpn" \
            "show bgp l2vpn evpn route type prefix" \
            "show bgp l2vpn evpn route type macip" \
            "show bgp l2vpn evpn route type multicast" \
            "show evpn vni" \
            "show ip route"; do
            slug=$(echo "$cmd" | tr ' ' '-')
            timeout 15 sudo docker exec clab-booty-type5-lab-spine01 \
              vtysh -c "$cmd" 2>/dev/null | tee type5-logs/spine01-${slug}.txt || true
          done

          # FRR state on leaves.
          for leaf in leaf01 leaf02; do
            for cmd in "show bgp summary json" "show bgp l2vpn evpn" "show ip route"; do
              slug=$(echo "$cmd" | tr ' ' '-')
              timeout 15 sudo docker exec "clab-booty-type5-lab-${leaf}" \
                vtysh -c "$cmd" 2>/dev/null | tee "type5-logs/${leaf}-${slug}.txt" || true
            done
          done

          # Network state from each container.
          for node in spine01 leaf01 leaf02 booty-vm0 booty-vm1; do
            name="clab-booty-type5-lab-${node}"
            {
              echo "=== ip -d link show type vxlan ==="
              timeout 5 sudo docker exec "${name}" ip -d link show type vxlan 2>&1 || true
              echo "=== ip addr show ==="
              timeout 5 sudo docker exec "${name}" ip addr show 2>&1 || true
              echo "=== ip route show ==="
              timeout 5 sudo docker exec "${name}" ip route show 2>&1 || true
              echo "=== ip neigh show ==="
              timeout 5 sudo docker exec "${name}" ip neigh show 2>&1 || true
              echo "=== ip route get VM paths ==="
              timeout 5 sudo docker exec "${name}" ip route get 10.200.0.10 2>&1 || true
              timeout 5 sudo docker exec "${name}" ip route get 10.200.0.11 2>&1 || true
              echo "=== bridge fdb show ==="
              timeout 5 sudo docker exec "${name}" bridge fdb show 2>&1 || true
              echo "=== listeners ==="
              timeout 5 sudo docker exec "${name}" ss -ltnp 2>&1 || true
            } > type5-logs/${node}-network.txt 2>&1
          done

      - name: Upload Type-5 logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: type5-logs
          path: type5-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if command -v containerlab >/dev/null 2>&1; then
            sudo containerlab destroy --topo test/e2e/clab/topology-type5.clab.yml --cleanup || true
          fi

  e2e-prodtpl:
    name: E2E Production Templates
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Build GoBGP test image
        run: test/e2e/clab/docker-build-retry.sh -t booty-gobgp-test:latest -f test/e2e/clab/booty-gobgp-test.Dockerfile .

      - name: Install ContainerLab
        run: test/e2e/clab/install-containerlab.sh "${CONTAINERLAB_VERSION}"

      - name: Load VRF and VXLAN kernel modules
        run: |
          # The template puts the uplinks into Vrf_underlay; a container can
          # not load modules itself ("Unknown device type").
          if ! sudo modprobe vrf; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq "linux-modules-extra-$(uname -r)"
            sudo modprobe vrf
          fi
          sudo modprobe vxlan

      - name: Deploy production template topology
        run: sudo containerlab deploy --topo test/e2e/clab/topology-production-templates.clab.yml

      - name: Run production template E2E tests
        env:
          GOMAXPROCS: "2"
        run: |
          set -o pipefail
          go test -tags e2e_prodtpl -v -race -count=1 -timeout 15m ./test/e2e/integration/... 2>&1 | tee e2e-prodtpl.log
          for expected in \
            TestProdTplLeafSessions \
            TestProdTplLocalASReplaceASPath \
            TestProdTplRRSessions \
            TestProdTplRRSessionVRFOutbound \
            TestProdTplFIBRoutes \
            TestProdTplFIBWithdraw \
            TestProdTplUplinkCarrierLoss \
            TestProdTplNativeVRFNameFIB \
            TestProdTplLeafSessionVRFInbound \
            TestProdTplCarrierLossPastBFD \
            TestProdTplRRSessionVRFInbound \
            TestProdTplType5IPv6Install \
            TestProdTplType5Origination \
            TestProdTplType5CAPRFOverIPv6 \
            TestProdTplBFDSessions \
            TestProdTplBFDFailover; do
            if ! grep -q "^--- PASS: ${expected} " e2e-prodtpl.log; then
              echo "::error::${expected} did not pass"
              exit 1
            fi
          done
          if grep -E '^[[:space:]]*--- SKIP:' e2e-prodtpl.log; then
            echo "::error::production template e2e tests skipped in CI"
            exit 1
          fi

      - name: Collect production template logs
        if: always()
        timeout-minutes: 5
        run: |
          mkdir -p prodtpl-logs
          for node in leaf01 dcgw01 dcgw02 shadow booty native native-vrf caprf-mock caprf6; do
            name="clab-booty-prodtpl-lab-${node}"
            timeout 30 sudo docker logs "${name}" > "prodtpl-logs/${node}.log" 2>&1 || true
            {
              echo "=== ip -d addr ==="
              timeout 5 sudo docker exec "${name}" ip -d addr show 2>&1 || true
              echo "=== ip route show table all ==="
              timeout 5 sudo docker exec "${name}" ip route show table all 2>&1 || true
              echo "=== ip -6 route show table all ==="
              timeout 5 sudo docker exec "${name}" ip -6 route show table all 2>&1 || true
              echo "=== ip neigh ==="
              timeout 5 sudo docker exec "${name}" ip neigh show 2>&1 || true
              echo "=== bridge fdb ==="
              timeout 5 sudo docker exec "${name}" bridge fdb show 2>&1 || true
              echo "=== ss -tn ==="
              timeout 5 sudo docker exec "${name}" ss -tn 2>&1 || true
            } > "prodtpl-logs/${node}-network.txt" 2>&1
          done
          for node in leaf01 dcgw01 dcgw02 shadow; do
            for cmd in "show bgp vrf all summary json" "show bgp vrf all neighbors json" "show bgp ipv4 unicast" "show bgp l2vpn evpn" "show bfd peers json"; do
              slug=$(echo "$cmd" | tr ' ' '-')
              timeout 15 sudo docker exec "clab-booty-prodtpl-lab-${node}" vtysh -c "$cmd" > "prodtpl-logs/${node}-${slug}.txt" 2>&1 || true
            done
          done

      - name: Upload production template logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: prodtpl-logs
          path: |
            e2e-prodtpl.log
            prodtpl-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if command -v containerlab >/dev/null 2>&1; then
            sudo containerlab destroy --topo test/e2e/clab/topology-production-templates.clab.yml --cleanup || true
          fi

  e2e-vrnetlab:
    name: E2E EVPN Boot (vrnetlab)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Build BOOTy vrnetlab VM image
        run: test/e2e/clab/docker-build-retry.sh -t booty-vrnetlab:latest -f test/e2e/clab/vrnetlab/Dockerfile .

      - name: Generate test disk image
        run: sudo test/e2e/clab/create-test-image.sh test/e2e/clab/images

      - name: Install ContainerLab
        run: test/e2e/clab/install-containerlab.sh "${CONTAINERLAB_VERSION}"

      - name: Deploy vrnetlab EVPN topology
        run: sudo containerlab deploy --topo test/e2e/clab/topology-vrnetlab.clab.yml

      - name: Wait for BGP convergence
        run: |
          echo "Waiting for BGP sessions to establish..."
          for i in $(seq 1 90); do
            if sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp summary" 2>/dev/null \
               | grep -qE "[0-9]{2}:[0-9]{2}:[0-9]{2}"; then
              echo "BGP established after ${i}s"
              sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp summary"
              break
            fi
            sleep 1
          done
          if ! sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp summary" 2>/dev/null | grep -qE "[0-9]{2}:[0-9]{2}:[0-9]{2}"; then
            echo "BGP did not converge in 90s"
            sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp summary" || true
            exit 1
          fi
          echo "Waiting for EVPN routes to appear after BGP convergence..."
          for i in $(seq 1 60); do
            if sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null | grep -qE "\[[0-9]+\]:\[[0-9]+\]"; then
              echo "EVPN routes detected after ${i}s"
              sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp l2vpn evpn"
              break
            fi
            sleep 1
          done
          if ! sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null | grep -qE "\[[0-9]+\]:\[[0-9]+\]"; then
            echo "EVPN routes did not appear in 60s after BGP convergence"
            sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp summary" || true
            sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp l2vpn evpn" || true
            exit 1
          fi

      - name: Wait for VM boot
        run: |
          echo "Waiting for BOOTy QEMU VM to start..."
          for i in $(seq 1 120); do
            if sudo docker logs clab-booty-vrnetlab-lab-booty-provision 2>&1 | grep -q "starting BOOTy\|Starting BOOTy"; then
              echo "BOOTy VM started after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "VM did not boot in 120s — dumping serial log:"
          sudo docker logs clab-booty-vrnetlab-lab-booty-provision 2>&1 | tail -50
          exit 1

      - name: Run vrnetlab EVPN E2E tests
        # -parallel=2 is a no-op without t.Parallel(); use GOMAXPROCS to cap OS threads.
        env:
          GOMAXPROCS: "2"
        run: |
          set -o pipefail
          go test -tags e2e_vrnetlab -v -race -count=1 -timeout 30m ./test/e2e/integration/... 2>&1 | tee e2e-vrnetlab.log
          if grep -E '^[[:space:]]*--- SKIP:' e2e-vrnetlab.log; then
            echo "::error::vrnetlab e2e tests skipped in CI"
            exit 1
          fi

      - name: Collect vrnetlab logs
        if: always()
        timeout-minutes: 8
        run: |
          mkdir -p vrnetlab-logs

          for node in booty-provision booty-deprovision booty-standby; do
            name="clab-booty-vrnetlab-lab-${node}"
            echo ""
            echo "======================================="
            echo "  ${node} SERIAL LOG"
            echo "======================================="
            timeout 30 sudo docker logs "${name}" 2>&1 | tee vrnetlab-logs/${node}-serial.log || echo "(no logs)"
            echo "======================================="
          done

          echo ""
          echo "======================================="
          echo "  CAPRF Mock Access Log"
          echo "======================================="
          timeout 15 sudo docker exec clab-booty-vrnetlab-lab-caprf-mock cat /var/log/nginx/access.log 2>/dev/null \
            | tee vrnetlab-logs/caprf-access.log || echo "(no logs)"

          echo ""
          echo "======================================="
          echo "  BGP Summary (spine01)"
          echo "======================================="
          timeout 15 sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp summary" 2>/dev/null \
            | tee vrnetlab-logs/bgp-summary.txt || true

          echo ""
          echo "======================================="
          echo "  BGP Neighbor Detail (spine01)"
          echo "======================================="
          timeout 15 sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp neighbor json" 2>/dev/null \
            | tee vrnetlab-logs/bgp-neighbor.json || true

          echo ""
          echo "======================================="
          echo "  BFD Peers (spine01)"
          echo "======================================="
          timeout 15 sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bfd peers json" 2>/dev/null \
            | tee vrnetlab-logs/bfd-peers.json || true

          echo ""
          echo "======================================="
          echo "  EVPN State (spine01)"
          echo "======================================="
          timeout 15 sudo docker exec clab-booty-vrnetlab-lab-spine01 vtysh -c "show bgp l2vpn evpn" 2>/dev/null \
            | tee vrnetlab-logs/evpn-state.txt || true

          # Check for unexpected ERROR-level log entries in vrnetlab serial logs
          ALLOWED_ERRORS="no suitable disk found|detect-disk|partition-disk|parse-partitions|format-disk|stream-image|[Pp]rovisioning failed|[Pp]rovisioning step|[Dd]eprovisioning failed|[Dd]eprovisioning step|Connecting to provisioning server|DEBUG DUMP|=== DEBUG|=== CONFIG|Disk Error|msg=DEBUG|debug dump|Debug command|DEBUG env|CAPRF client|dry-run failed|mode exited with error"
          VRNETLAB_ERRORS=""
          for logfile in vrnetlab-logs/*-serial.log; do
            [ -f "$logfile" ] || continue
            UNEXPECTED=$(grep 'level=ERROR' "$logfile" 2>/dev/null | grep -vE "$ALLOWED_ERRORS" || true)
            if [ -n "$UNEXPECTED" ]; then
              echo "ERROR: Unexpected ERROR-level logs in $(basename "$logfile"):"
              echo "$UNEXPECTED"
              VRNETLAB_ERRORS="yes"
            fi
          done
          if [ -n "$VRNETLAB_ERRORS" ]; then
            echo "::error::Unexpected ERROR-level log entries found in vrnetlab serial logs"
            exit 1
          else
            echo "PASS: No unexpected ERROR-level log entries in vrnetlab serial logs"
          fi

      - name: Upload vrnetlab logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vrnetlab-logs
          path: vrnetlab-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if command -v containerlab >/dev/null 2>&1; then
            sudo containerlab destroy --topo test/e2e/clab/topology-vrnetlab.clab.yml --cleanup || true
          fi

  e2e-gobgp-vrnetlab:
    name: E2E GoBGP PeerModes (vrnetlab)
    runs-on: ubuntu-latest
    needs: [build]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.6"

      - name: Build BOOTy vrnetlab VM image
        run: test/e2e/clab/docker-build-retry.sh -t booty-vrnetlab:latest -f test/e2e/clab/vrnetlab/Dockerfile .

      - name: Install ContainerLab
        run: test/e2e/clab/install-containerlab.sh "${CONTAINERLAB_VERSION}"

      - name: Deploy GoBGP vrnetlab topology
        run: sudo containerlab deploy --topo test/e2e/clab/topology-gobgp-vrnetlab.clab.yml

      - name: Run GoBGP vrnetlab E2E tests
        env:
          GOMAXPROCS: "2"
        run: |
          set -o pipefail
          go test -tags e2e_gobgp_vrnetlab -v -race -count=1 -timeout 30m ./test/e2e/integration/... 2>&1 | tee e2e-gobgp-vrnetlab.log
          if grep -E '^[[:space:]]*--- SKIP:' e2e-gobgp-vrnetlab.log; then
            echo "::error::gobgp vrnetlab e2e tests skipped in CI"
            exit 1
          fi

      - name: Collect GoBGP vrnetlab logs
        if: always()
        timeout-minutes: 8
        run: |
          mkdir -p gobgp-vrnetlab-logs

          for node in spine01 rr01 booty-unnumbered booty-dual booty-numbered; do
            name="clab-booty-gobgp-vrnetlab-lab-${node}"
            {
              echo "=== docker logs ${name} ==="
              timeout 30 sudo docker logs "${name}" 2>&1 || true
              echo
              echo "=== ip addr ==="
              timeout 10 sudo docker exec "${name}" ip addr 2>&1 || true
              echo
              echo "=== ip route ==="
              timeout 10 sudo docker exec "${name}" ip route 2>&1 || true
            } > "gobgp-vrnetlab-logs/${node}.log" 2>&1
          done

          for node in spine01 rr01; do
            name="clab-booty-gobgp-vrnetlab-lab-${node}"
            {
              echo "=== show bgp summary ==="
              timeout 15 sudo docker exec "${name}" vtysh -c "show bgp summary" 2>&1 || true
              echo
              echo "=== show bgp l2vpn evpn ==="
              timeout 15 sudo docker exec "${name}" vtysh -c "show bgp l2vpn evpn" 2>&1 || true
              echo
              echo "=== show bgp neighbor json ==="
              timeout 15 sudo docker exec "${name}" vtysh -c "show bgp neighbor json" 2>&1 || true
            } > "gobgp-vrnetlab-logs/${node}-bgp.log" 2>&1
          done

      - name: Upload GoBGP vrnetlab logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gobgp-vrnetlab-logs
          path: gobgp-vrnetlab-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup
        if: always()
        run: |
          if command -v containerlab >/dev/null 2>&1; then
            sudo containerlab destroy --topo test/e2e/clab/topology-gobgp-vrnetlab.clab.yml --cleanup || true
          fi
