version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    allow:
      - dependency-type: all
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # go.mod replaces GoBGP with the fork tag v4.10.0-booty.10, so an
      # upstream bump would not change the build. Move the fork tag by hand:
      # docs/networking.md#gobgp-version-and-fork
      - dependency-name: github.com/osrg/gobgp/v4
      # Same for the gopacket, netlink and dhcp forks: docs/dependency-forks.md
      - dependency-name: github.com/gopacket/gopacket
      - dependency-name: github.com/vishvananda/netlink
      - dependency-name: github.com/insomniacslk/dhcp

  - package-ecosystem: docker
    # Dockerfile discovery is not recursive. List each independent context so
    # shared image updates can be grouped across the contexts that use them.
    directories:
      - /
      - /test/e2e/clab
      - /test/e2e/clab/vrnetlab
      - /test/e2e/assets/busybox
    schedule:
      interval: weekly
    groups:
      docker-major:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - major
      docker-minor-patch:
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
