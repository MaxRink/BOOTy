! CAPRF-style config: the provisioning VNI is the default VRF L3VNI and
! advertise-all-vni is set. Like FRR, BOOTy must originate Type-5 routes
! only, with no Type-2 or Type-3 routes.
frr version 10.3.1
frr defaults datacenter
!
vni 100
!
router bgp 65030
 bgp router-id 10.0.0.22
 no bgp ebgp-requires-policy
 neighbor 10.0.2.1 remote-as 65000
 !
 address-family ipv4 unicast
  network 10.0.0.22/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor 10.0.2.1 activate
  advertise-all-vni
  advertise ipv4 unicast
 exit-address-family
exit
!
