frr version 8.2.2
frr defaults traditional
hostname frr-testserver
log stdout informational
log syslog informational
log file /var/log/frr.log
vni 3000
no ip forwarding
service integrated-vtysh-config
!
ipv6 route 2001:db8:40a:5481::/64 blackhole
!
router bgp 4210000017 vrf Vrf_underlay
bgp router-id 192.0.2.17
no bgp ebgp-requires-policy
no bgp suppress-duplicates
no bgp default ipv4-unicast
bgp bestpath as-path multipath-relax

neighbor dcgw peer-group
neighbor dcgw remote-as internal
neighbor dcgw bfd
neighbor dcgw bfd profile fabric
neighbor dcgw timers 30 90
neighbor dcgw timers connect 5

neighbor leaf peer-group
neighbor leaf remote-as 65500
neighbor leaf local-as 65501 no-prepend replace-as
neighbor leaf bfd
neighbor leaf bfd profile fabric
neighbor leaf timers 30 90
neighbor ens1f0np0 interface peer-group leaf
neighbor ens1f1np1 interface peer-group leaf

! Lab only, not in the bm4x template: an eBGP test peer (AS 65510) that
! makes the route-maps visible (#630 C13, C14).
neighbor tester peer-group
neighbor tester remote-as 65510
neighbor ens1f2np2 interface peer-group tester

neighbor 198.51.100.1 peer-group dcgw
neighbor 198.51.100.2 peer-group dcgw
!
address-family ipv4 unicast
  network 192.0.2.17/32
  neighbor leaf activate
  neighbor leaf soft-reconfiguration inbound
  neighbor leaf allowas-in
  neighbor leaf route-map TAG-FABRIC-IN in
  neighbor leaf route-map DENY-TAG-FABRIC-OUT out
  neighbor tester activate
  neighbor tester route-map DENY-TAG-FABRIC-OUT out
exit-address-family
!
address-family l2vpn evpn
  neighbor dcgw activate
  neighbor dcgw allowas-in
  neighbor dcgw route-map TAG-FABRIC-IN in
  neighbor dcgw route-map DENY-TAG-FABRIC-OUT out
  advertise-all-vni
exit-address-family
!
router bgp 4210000017 vrf default
  bgp router-id 192.0.2.17
  no bgp suppress-duplicates
  ! Lab only: an eBGP session without "no bgp ebgp-requires-policy".
  neighbor ens1f3np3 interface remote-as 65510
  !
  address-family ipv4 unicast
  neighbor ens1f3np3 activate
  exit-address-family
  !
  address-family ipv6 unicast
  network 2001:db8:40a:5481::17/128
  network 2001:db8:40a:5481::/64
  exit-address-family
  !
  address-family l2vpn evpn
  advertise ipv6 unicast
  route-target import 65169:3000
  route-target export 65169:3000
  exit-address-family
!
bfd
  profile fabric
  transmit-interval 150
  receive-interval 150
  exit
!
exit
!
route-map TAG-FABRIC-IN permit 10
  set local-preference 90
  set community 65169:200 additive
exit
!
bgp community-list standard cm-received-fabric permit 65169:200
!
route-map DENY-TAG-FABRIC-OUT deny 10
  match community cm-received-fabric
exit
!
route-map DENY-TAG-FABRIC-OUT permit 20
exit
!