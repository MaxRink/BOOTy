! L2VNI provisioning: advertise-all-vni and no L3VNI for VNI 100.
! BOOTy must originate Type-2 and Type-3 routes next to Type-5.
frr version 10.3.1
frr defaults datacenter
!
router bgp 65020
 bgp router-id 10.0.0.20
 no bgp ebgp-requires-policy
 neighbor eth1 interface remote-as external
 !
 address-family ipv4 unicast
  network 10.0.0.20/32
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor eth1 activate
  advertise-all-vni
 exit-address-family
exit
!
