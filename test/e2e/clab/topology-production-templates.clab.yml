# Production template lab (#630 slice b).
#
# The template variant (#630 section 4.3 matrix) is selected with
# PRODTPL_BOOTY_FS, PRODTPL_SHADOW_FRR, PRODTPL_SHADOW_SETUP,
# PRODTPL_LEAF_SETUP, PRODTPL_NATIVE_VARS and PRODTPL_NATIVE_VRF_VARS; unset
# means the two-uplink template. test/e2e/clab/prodtpl-variant.sh VARIANT
# prints them. The tests read PRODTPL_VARIANT.
#
# BOOTy gets the rendered bm4x-operator templates (data/fs-prodtpl-booty,
# a copy of pkg/network/frrconf/testdata/bm4x/two-uplinks). A shadow FRR
# node gets the same template rendered for 192.0.2.18
# (prodtpl-shadow.frr.conf) and peers with the same leaf and route
# reflectors. The tests compare the leaf and RR views of both nodes.
#
#   booty  ens1f0np0/ens1f1np1 ── leaf01 eth1/eth2   (eBGP unnumbered, local-as 65501)
#   shadow ens1f0np0/ens1f1np1 ── leaf01 eth3/eth4
#   dcgw01 eth1 ── leaf01 eth5, dcgw02 eth1 ── leaf01 eth6
#   native ens1f0np0/ens1f1np1 ── leaf01 eth7/eth8   (BOOTy, native vars keys only)
#   native-vrf ens1f0np0/ens1f1np1 ── leaf01 eth9/eth10 (unnumbered only, VRF_NAME without BGP_NEIGHBOR_VRF)
#   booty, shadow, native ── dcgw01, dcgw02 (iBGP l2vpn evpn in Vrf_underlay, via leaf01)
#
# dcgw01 is also the gateway of the provision L3VNI 3000 (#630 slice d):
#
#   dcgw01 eth2 (VRF provision, 2001:db8:c0::1/64) ── caprf6 eth1 (2001:db8:c0::10)
#
# It sends the IPv6 Type-5 default and 2001:db8:c0::/64 to the servers.
# The servers reach caprf6 over that default from their lo /128. BOOTy
# reports to the CAPRF mock over the management network.
name: booty-prodtpl-lab

mgmt:
  network: booty-prodtpl-mgmt
  ipv4-subnet: 172.31.250.0/24

topology:
  nodes:
    leaf01:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - prodtpl-leaf01.frr.conf:/etc/frr/frr.conf:ro
        - ${PRODTPL_LEAF_SETUP:=prodtpl-leaf-setup.sh}:/setup.sh:ro
        - daemons:/etc/frr/daemons:ro
      exec:
        - sh /setup.sh

    dcgw01:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - prodtpl-dcgw01.frr.conf:/etc/frr/frr.conf:ro
        - daemons:/etc/frr/daemons:ro
      exec:
        - ip link set dev eth1 mtu 9100 up
        - sysctl -w net.ipv6.conf.all.forwarding=1
        - ip link add provision type vrf table 100
        - ip link set provision up
        - ip link add br3000 address 02:54:c6:33:64:01 type bridge
        - ip link set br3000 master provision addrgenmode none up
        - ip link add vx3000 type vxlan id 3000 local 198.51.100.1 dstport 4789 nolearning
        - ip link set vx3000 master br3000 up
        - ip link set eth2 master provision up
        - ip -6 addr add 2001:db8:c0::1/64 dev eth2 nodad

    dcgw02:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - prodtpl-dcgw02.frr.conf:/etc/frr/frr.conf:ro
        - daemons:/etc/frr/daemons:ro
      exec:
        - ip link set dev eth1 mtu 9100 up

    # FRR with the production template, netplan applied by hand.
    shadow:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - ${PRODTPL_SHADOW_FRR:=prodtpl-shadow.frr.conf}:/etc/frr/frr.conf:ro
        - ${PRODTPL_SHADOW_SETUP:=prodtpl-shadow-setup.sh}:/setup.sh:ro
        - daemons:/etc/frr/daemons:ro
        # A machine ID, like systemd creates on the legacy ramdisk.
        - data/machine-id-shadow:/etc/machine-id:ro
      exec:
        - sh /setup.sh

    booty:
      kind: linux
      image: booty-gobgp-test:latest
      startup-delay: 20
      binds:
        - data/vars-prodtpl-booty:/deploy/vars:ro
        - ${PRODTPL_BOOTY_FS:=data/fs-prodtpl-booty}:/deploy/file-system:ro
      env:
        BOOTY_NO_REBOOT: "1"
      exec:
        - dd if=/dev/zero of=/tmp/disk.img bs=1M count=0 seek=2048
        - sh -c 'test -b /dev/loop0 || mknod -m 660 /dev/loop0 b 7 0'
        - losetup /dev/loop0 /tmp/disk.img

    # eBGP test peer (AS 65510) of BOOTy and the shadow node. It shows the
    # route-maps: DENY-TAG-FABRIC-OUT keeps the fabric routes from it, and
    # TAG-FABRIC-IN (local-pref 90 on the leaf path) makes its longer path
    # to 198.18.0.0/24 the best one.
    tester:
      kind: linux
      image: quay.io/frrouting/frr:10.3.1
      binds:
        - prodtpl-tester.frr.conf:/etc/frr/frr.conf:ro
        - daemons:/etc/frr/daemons:ro
      exec:
        - sh -c 'for i in 1 2 3 4; do ip link set dev eth$i mtu 9100 up; done'

    # IPv6 CAPRF mock behind the L3VNI gateway.
    caprf6:
      kind: linux
      image: nginx:alpine
      binds:
        - caprf6.conf:/etc/nginx/nginx.conf:ro
      exec:
        - ip -6 addr add 2001:db8:c0::10/64 dev eth1
        - ip -6 route replace default via 2001:db8:c0::1 dev eth1

    # BOOTy configured only by native vars keys: no provisioner netplan,
    # no frr.conf, no CAPRF_LEGACY_COMPAT (#630 slice n).
    native:
      kind: linux
      image: booty-gobgp-test:latest
      startup-delay: 20
      binds:
        - ${PRODTPL_NATIVE_VARS:=data/vars-prodtpl-native}:/deploy/vars:ro
      env:
        BOOTY_NO_REBOOT: "1"

    # Native vars keys with only the leaf sessions: VRF_NAME, no
    # BGP_NEIGHBOR_VRF.
    native-vrf:
      kind: linux
      image: booty-gobgp-test:latest
      startup-delay: 20
      binds:
        - ${PRODTPL_NATIVE_VRF_VARS:=data/vars-prodtpl-native-vrf}:/deploy/vars:ro
      env:
        BOOTY_NO_REBOOT: "1"

    # systemd-networkd with EmitLLDP=yes, the LLDP reference: lldp0 to the
    # leaf (frame compared with BOOTy's), lldp1 to BOOTy (LLDP receive).
    networkd:
      kind: linux
      image: booty-networkd-test:latest

    caprf-mock:
      kind: linux
      image: nginx:alpine
      mgmt-ipv4: 172.31.250.10
      binds:
        - caprf-mock.conf:/etc/nginx/nginx.conf:ro
        - images:/srv/images:ro
        - data:/srv/data:ro

  links:
    - endpoints: ["leaf01:eth1", "booty:ens1f0np0"]
    - endpoints: ["leaf01:eth2", "booty:ens1f1np1"]
    - endpoints: ["leaf01:eth3", "shadow:ens1f0np0"]
    - endpoints: ["leaf01:eth4", "shadow:ens1f1np1"]
    - endpoints: ["leaf01:eth5", "dcgw01:eth1"]
    - endpoints: ["leaf01:eth6", "dcgw02:eth1"]
    - endpoints: ["dcgw01:eth2", "caprf6:eth1"]
    - endpoints: ["tester:eth1", "booty:ens1f2np2"]
    - endpoints: ["tester:eth2", "shadow:ens1f2np2"]
    # Default VRF sessions without "no bgp ebgp-requires-policy".
    - endpoints: ["tester:eth3", "booty:ens1f3np3"]
    - endpoints: ["tester:eth4", "shadow:ens1f3np3"]
    - endpoints: ["leaf01:eth7", "native:ens1f0np0"]
    - endpoints: ["leaf01:eth8", "native:ens1f1np1"]
    - endpoints: ["leaf01:eth9", "native-vrf:ens1f0np0"]
    - endpoints: ["leaf01:eth10", "native-vrf:ens1f1np1"]
    - endpoints: ["leaf01:eth11", "networkd:lldp0"]
    - endpoints: ["booty:lldp1", "networkd:lldp1"]
