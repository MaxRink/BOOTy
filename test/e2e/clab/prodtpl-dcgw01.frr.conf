! DCGW route reflector 1 (AS 4210000017) of the production template lab.
!   eth1 -> leaf01 (unnumbered eBGP, advertises the RR loopback)
! iBGP l2vpn evpn to the servers 192.0.2.17 (BOOTy), 192.0.2.18 (shadow) and
! 192.0.2.19 (native).
! The test blocks BOOTy outbound, so this RR opens the session (inbound test).
! It is also the EVPN gateway of the provision L3VNI 3000 (VRF provision,
! RMAC 02:54:c6:33:64:01): it sends the IPv6 Type-5 default and the
! connected prefix of the IPv6 CAPRF mock (eth2) to the servers.
frr version 10.3.1
frr defaults traditional
!
interface lo
 ip address 198.51.100.1/32
exit
!
vrf provision
 vni 3000
exit-vrf
!
router bgp 4210000017
 bgp router-id 198.51.100.1
 no bgp ebgp-requires-policy
 no bgp default ipv4-unicast
 neighbor eth1 interface remote-as 65500
 neighbor servers peer-group
 neighbor servers remote-as internal
 neighbor servers update-source lo
 neighbor servers timers connect 5
 neighbor 192.0.2.17 peer-group servers
 neighbor 192.0.2.18 peer-group servers
 neighbor 192.0.2.19 peer-group servers
 !
 address-family ipv4 unicast
  network 198.51.100.1/32
  neighbor eth1 activate
 exit-address-family
 !
 address-family l2vpn evpn
  neighbor servers activate
  neighbor servers route-reflector-client
  advertise-all-vni
 exit-address-family
exit
!
router bgp 4210000017 vrf provision
 bgp router-id 198.51.100.1
 !
 address-family ipv6 unicast
  redistribute connected
 exit-address-family
 !
 address-family l2vpn evpn
  advertise ipv6 unicast
  default-originate ipv6
  route-target import 65169:3000
  route-target export 65169:3000
 exit-address-family
exit
!
