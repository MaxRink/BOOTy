# IPv6 CAPRF mock of the production template lab. It logs the client
# address, so the tests see which source the servers used.
worker_processes 1;
events { worker_connections 64; }

http {
    log_format caprf '$remote_addr "$request" $status';
    access_log /var/log/nginx/access.log caprf;

    server {
        listen [::]:80;

        location = /health {
            return 200 'ok';
        }
    }
}
