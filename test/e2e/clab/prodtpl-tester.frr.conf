! eBGP test peer (AS 65510) of the production template lab.
!   eth1 -> booty ens1f2np2, eth2 -> shadow ens1f2np2 (unnumbered, Vrf_underlay)
!   eth3 -> booty ens1f3np3, eth4 -> shadow ens1f3np3 (default VRF, where the
!   servers keep bgp ebgp-requires-policy on)
! It sends 198.18.0.0/24 with a long AS path. The leaf sends the same
! prefix with a short one, but TAG-FABRIC-IN gives the leaf path
! local-pref 90, so the servers must prefer this path.
frr version 10.3.1
frr defaults traditional
!
ip route 198.18.0.0/24 blackhole
!
interface eth1
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth2
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth3
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth4
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
route-map LONG permit 10
 set as-path prepend 65510 65510
exit
!
router bgp 65510
 bgp router-id 10.0.0.10
 no bgp ebgp-requires-policy
 neighbor servers peer-group
 neighbor servers remote-as external
 neighbor eth1 interface peer-group servers
 neighbor eth2 interface peer-group servers
 neighbor eth3 interface peer-group servers
 neighbor eth4 interface peer-group servers
 !
 address-family ipv4 unicast
  network 198.18.0.0/24
  neighbor servers soft-reconfiguration inbound
  neighbor servers route-map LONG out
 exit-address-family
exit
!
