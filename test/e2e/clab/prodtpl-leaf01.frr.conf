! Leaf (AS 65500) of the production template lab.
!   eth1, eth2 -> booty  ens1f0np0, ens1f1np1  (unnumbered, server local-as 65501)
!   eth3, eth4 -> shadow ens1f0np0, ens1f1np1  (same, FRR with the same template)
!   eth7, eth8 -> native ens1f0np0, ens1f1np1  (BOOTy, native vars keys only)
!   eth9, eth10 -> native-vrf ens1f0np0, ens1f1np1 (BOOTy, leaf sessions only)
!   eth5, eth6 -> dcgw01, dcgw02               (unnumbered, AS 4210000017)
! Traditional defaults (keepalive 60, hold 180), so the negotiated timers
! come from the server template (30/90).
frr version 10.3.1
frr defaults traditional
!
interface eth1
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth2
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth3
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth4
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth7
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth8
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth9
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
interface eth10
 ipv6 nd ra-interval 10
 no ipv6 nd suppress-ra
exit
!
! Routes with the servers' local-as 65501 in the AS path (local-as loop
! check, #630 C6): 4 times is more than allowas-in 3 permits, 3 times is not.
ip route 198.18.0.0/24 blackhole
ip route 203.0.113.0/24 blackhole
ip route 203.0.113.128/25 blackhole
ip prefix-list LOOP-4 seq 5 permit 203.0.113.0/24
ip prefix-list LOOP-3 seq 5 permit 203.0.113.128/25
route-map SERVERS-OUT permit 10
 match ip address prefix-list LOOP-4
 set as-path prepend 65501 65501 65501 65501
exit
route-map SERVERS-OUT permit 20
 match ip address prefix-list LOOP-3
 set as-path prepend 65501 65501 65501
exit
route-map SERVERS-OUT permit 30
exit
!
router bgp 65500
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor servers peer-group
 neighbor servers remote-as 65501
 neighbor servers bfd
 neighbor eth1 interface peer-group servers
 neighbor eth2 interface peer-group servers
 neighbor eth3 interface peer-group servers
 neighbor eth4 interface peer-group servers
 neighbor eth7 interface peer-group servers
 neighbor eth8 interface peer-group servers
 neighbor eth9 interface peer-group servers
 neighbor eth10 interface peer-group servers
 neighbor dcgw peer-group
 neighbor dcgw remote-as 4210000017
 neighbor eth5 interface peer-group dcgw
 neighbor eth6 interface peer-group dcgw
 !
 address-family ipv4 unicast
  network 198.18.0.0/24
  network 203.0.113.0/24
  network 203.0.113.128/25
  neighbor servers activate
  neighbor servers route-map SERVERS-OUT out
  neighbor dcgw activate
 exit-address-family
exit
!
